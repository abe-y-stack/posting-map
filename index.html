<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PostingMap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#6e6e73;--faint:#aeaeb2;--line:rgba(60,60,67,.13);
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--past:#3a3a3c;
  --glass:rgba(255,255,255,.86);--r:16px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{font-size:16px}
svg.i{width:22px;height:22px;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}

/* ---------- HOME ---------- */
#home{overflow-y:auto;padding:calc(var(--st) + 28px) 20px calc(var(--sb) + 28px)}
.wrap{max-width:560px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand small{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--faint)}
.brand h1{margin:2px 0 0;font-size:30px;letter-spacing:-.02em}
.pill-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600;color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sec{font-size:13px;font-weight:600;color:var(--sub);margin:22px 4px 8px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;width:100%;text-align:left}
.row+.row{border-top:.5px solid var(--line)}
button.row:active{background:#e9e9ee}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:13px;color:var(--sub)}
.chev{color:var(--faint);font-size:20px}
.empty{padding:28px 16px;text-align:center;color:var(--sub);font-size:14px}
.banner{border-radius:var(--r);padding:14px 16px;font-size:14px;line-height:1.55;margin-bottom:14px}
.banner.err{background:#fff1f0;color:#b3261e}
.banner.warn{background:#fff7e6;color:#8a5300}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#e5f0ff;color:var(--blue)}
.badge.gray{background:#ececf0;color:var(--sub)}

/* ---------- TOP BAR ---------- */
.bar{position:relative;z-index:900;padding-top:var(--st);border-bottom:.5px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.icon-btn:active{background:rgba(0,0,0,.06)}
.bar-title{flex:1;min-width:0}
.bar-title b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(0,0,0,.05);color:var(--sub)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.net.ok i{background:var(--green)}.net.wait i{background:var(--orange)}.net.err i{background:var(--red)}
.net.err{color:var(--red)}
.save-btn{padding:8px 16px;border-radius:99px;background:var(--blue);color:#fff;font-weight:600;font-size:15px}
.save-btn:disabled{opacity:.4}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 10px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;min-width:84px;background:var(--card);border-radius:14px;padding:8px 12px 10px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.05);position:relative}
.chip.me{box-shadow:0 0 0 2px var(--c) inset}
.chip .n{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap}
.chip .n i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip .v{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.chip .v small{font-size:11px;font-weight:600;color:var(--faint);margin-left:2px}
.chip .pb{height:3px;border-radius:2px;background:#ececf0;margin-top:6px;overflow:hidden}
.chip .pb>i{display:block;height:100%;background:var(--c);border-radius:2px}

/* ---------- MAP ---------- */
.map-wrap{position:relative;flex:1;min-height:0}
.map{position:absolute;inset:0;background:#e8e8ea;z-index:0;isolation:isolate}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)!important}
.leaflet-popup-content-wrapper{border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.leaflet-popup-content{margin:14px 16px;min-width:220px;max-width:calc(100vw - 90px)}
.leaflet-popup-close-button{top:6px!important;right:6px!important;font-size:20px!important;color:var(--faint)!important}
.fab{position:absolute;z-index:800;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.15)}
.fab:active{transform:scale(.94)}
.fab.on{color:#fff;background:var(--blue)}
.map-note{position:absolute;z-index:800;left:12px;top:12px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:12px;padding:7px 10px;font-size:12px;color:var(--sub);box-shadow:0 1px 6px rgba(0,0,0,.1);display:flex;gap:10px;align-items:center;pointer-events:none}
.sw{display:inline-block;width:16px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.sw.past{background:repeating-linear-gradient(135deg,#3a3a3c 0 2px,rgba(58,58,60,.25) 2px 5px);border:1px solid #3a3a3c}
.sw.done{width:11px;border-radius:50%;background:var(--green);border:2px solid #fff;box-shadow:0 0 0 1px #8e8e93}

/* map labels */
.zl{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(255,255,255,.94);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.15);border-left:4px solid var(--c)}
.zl span{font-weight:500;color:var(--sub);margin-left:6px}
.pl{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;background:var(--past);color:#fff;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.apt{display:inline-flex;align-items:center;gap:5px;transform:translate(-50%,-100%);white-space:nowrap;background:#fff;border-radius:10px;padding:4px 9px 4px 6px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.22);border:2px solid #1c1c1e;position:relative}
.apt:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:inherit}
.apt.done{background:var(--green);border-color:#1f9d45;color:#fff}
.apt.past{background:#d1d1d6;border-color:#8e8e93;color:#48484a;font-weight:600}
.apt.cand{background:#fff7e6;border:2px dashed var(--orange);color:#a05a00}
.apt.pend{opacity:.65}
.who{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%)}
.who b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.who span{margin-top:2px;font-size:11px;font-weight:700;background:#fff;border-radius:6px;padding:1px 6px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.who.stale{opacity:.45}
.me-dot{width:22px;height:22px;transform:translate(-50%,-50%);position:relative}
.me-dot:before{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(0,122,255,.16);animation:pulse 2s infinite}
.me-dot b{position:absolute;inset:0;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.me-dot i{position:absolute;left:50%;top:-16px;margin-left:-7px;border:7px solid transparent;border-bottom:12px solid var(--blue);border-top:0;transform-origin:7px 27px;display:none}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.9}50%{transform:scale(1.15);opacity:.25}}
.vh{width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:3px solid var(--c);box-shadow:0 1px 5px rgba(0,0,0,.35)}

/* ---------- TAB BAR ---------- */
.tabs{position:relative;z-index:900;display:flex;padding:6px 8px calc(var(--sb) + 6px);border-top:.5px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--sub);border-radius:12px}
.tab:active{background:rgba(0,0,0,.05)}
.tab svg{color:#3a3a3c}

/* ---------- SHEET / MODAL ---------- */
.scrim{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.32,.72,0,1);padding-bottom:var(--sb)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 16px 8px;position:relative}
.sheet-h:before{content:"";position:absolute;left:50%;top:6px;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:#c7c7cc}
.sheet-h h3{flex:1;margin:14px 0 0;font-size:20px;letter-spacing:-.01em}
.sheet-h .icon-btn{margin-top:12px;background:#e5e5ea;color:var(--sub);width:30px;height:30px}
.sheet-b{overflow-y:auto;padding:6px 16px 20px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--card);border-radius:18px;width:calc(100% - 48px);max-width:340px;margin:auto;padding:20px;text-align:center;animation:pop .22s cubic-bezier(.32,.72,0,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.dlg h4{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 18px;font-size:14px;color:var(--sub);white-space:pre-wrap;word-break:break-word}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:13px 10px;border-radius:12px;font-weight:600;font-size:16px;background:#e9e9ee;text-align:center}
.btn:active{filter:brightness(.92)}
.btn.p{background:var(--blue);color:#fff}
.btn.g{background:var(--green);color:#fff}
.btn.d{background:#ffe5e3;color:var(--red)}
.btn.w{width:100%;flex:none;display:block}
.btn:disabled{opacity:.45}
.btn+.btn.w{margin-top:8px}
.field{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:50px}
.field+.field{border-top:.5px solid var(--line)}
.field label{width:76px;flex:none;font-size:15px;color:var(--sub)}
.field input,.field select{flex:1;min-width:0;border:0;outline:0;background:none;padding:0}
.seg{display:flex;background:#e3e3e8;border-radius:10px;padding:2px;gap:2px;flex:1}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.colors{display:flex;flex-wrap:wrap;gap:10px;flex:1}
.colors button{width:30px;height:30px;border-radius:50%;background:var(--c)}
.colors button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.stepper{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.stepper button{width:44px;height:44px;border-radius:50%;background:#e9e9ee;font-size:22px;font-weight:600;display:grid;place-items:center}
.stepper input{flex:1;min-width:0;text-align:center;font-size:28px;font-weight:700;border:0;border-radius:12px;background:#f2f2f7;padding:8px;outline:0}
.lbl{font-size:12px;font-weight:600;color:var(--sub);margin:4px 0 6px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.people button{padding:7px 12px;border-radius:99px;font-size:14px;font-weight:600;background:#f2f2f7;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.people button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.people button.on{background:var(--c);color:#fff}
.people button.on i{background:#fff}
.pop-t{font-size:16px;font-weight:700;margin-bottom:2px;padding-right:18px}
.pop-s{font-size:12px;color:var(--sub);margin-bottom:12px}
.done-box{background:#eafaf0;border-radius:12px;padding:12px;text-align:center;margin-bottom:10px}
.done-box b{font-size:28px;color:#1f9d45}
.done-box span{display:block;font-size:12px;color:#1f9d45;font-weight:600}
.prog{margin:4px 0 18px;text-align:center}
.prog b{font-size:48px;letter-spacing:-.03em;line-height:1}
.prog span{display:block;font-size:13px;color:var(--sub);margin-top:4px}
.bar-l{height:6px;border-radius:3px;background:#ececf0;overflow:hidden;margin-top:6px}
.bar-l i{display:block;height:100%;border-radius:3px;background:var(--c)}
.sw-row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:50px}
.sw-row+.sw-row{border-top:.5px solid var(--line)}
.sw-row .t{flex:1}
.tg{width:51px;height:31px;border-radius:99px;background:#e9e9ea;position:relative;transition:background .2s;flex:none}
.tg:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.tg.on{background:var(--green)}.tg.on:after{transform:translateX(20px)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);z-index:3000;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:14px;background:rgba(28,28,30,.92);color:#fff;border-radius:14px;padding:11px 14px 11px 16px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#ed.on~#toast{bottom:auto;top:calc(var(--st) + 70px)}
#toast.warn{background:rgba(160,80,0,.94)}
#toast button{color:#64d2ff;font-weight:700;white-space:nowrap}

/* editor panel */
.panel{position:relative;z-index:900;background:var(--bg);border-radius:20px 20px 0 0;margin-top:-18px;box-shadow:0 -4px 20px rgba(0,0,0,.08);max-height:46vh;display:flex;flex-direction:column;padding-bottom:var(--sb);transition:max-height .3s}
.panel.min{max-height:74px}
.panel-h{flex:none;display:flex;align-items:center;justify-content:center;height:22px}
.panel-h i{width:36px;height:5px;border-radius:3px;background:#c7c7cc}
.panel-b{overflow-y:auto;padding:0 16px 16px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;min-height:58px}
.mrow+.mrow{border-top:.5px solid var(--line)}
.mrow .t{flex:1;min-width:0;text-align:left}
.mrow .t b{display:block;font-size:15px}
.mrow .t span{font-size:12px;color:var(--sub)}
.mrow .t span.bad{color:var(--red);font-weight:600}
.mini{padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;background:#e5f0ff;color:var(--blue);white-space:nowrap}
.mini.sel{background:var(--blue);color:#fff}
.drawbar{padding:4px 16px 12px}
.drawbar p{margin:0 0 10px;font-size:14px;line-height:1.5}
.drawbar p b{color:var(--c)}
.warnlist{background:#fff1f0;color:#b3261e;border-radius:12px;padding:10px 14px;font-size:13px;margin-top:12px;line-height:1.6}
@media (min-width:900px){ .panel{position:absolute;left:12px;top:calc(var(--st) + 66px);bottom:12px;width:380px;max-height:none;margin:0;border-radius:18px;box-shadow:0 6px 30px rgba(0,0,0,.15)} .panel.min{max-height:none} .panel-h{display:none} #ed .map-note{left:404px} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="rgba(58,58,60,.22)"/><rect width="3" height="8" fill="rgba(58,58,60,.55)"/>
    </pattern>
  </defs>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="12" width="4" height="9" rx="1.5"/><rect x="10" y="7" width="4" height="14" rx="1.5"/><rect x="17" y="3" width="4" height="18" rx="1.5"/></g></symbol>
  <symbol id="i-bld" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 10h4a1 1 0 0 1 1 1v10M2 21h20"/><path d="M8 8h3M8 12h3M8 16h3" stroke-linecap="round"/></g></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></g></symbol>
  <symbol id="i-loc" viewBox="0 0 24 24"><path d="M21 3L3 10.5l7.5 2.9L13.4 21z" fill="currentColor"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm8.4-2.1l1.6 1.2-2 3.4-1.9-.7a8 8 0 0 1-2.2 1.3l-.3 2h-4l-.3-2a8 8 0 0 1-2.2-1.3l-1.9.7-2-3.4 1.6-1.2a8 8 0 0 1 0-2.6L2.2 9.4l2-3.4 1.9.7a8 8 0 0 1 2.2-1.3l.3-2h4l.3 2a8 8 0 0 1 2.2 1.3l1.9-.7 2 3.4-1.6 1.2a8 8 0 0 1 0 2.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
</svg>

<!-- ============ HOME ============ -->
<section id="home" class="screen on">
  <div class="wrap">
    <div class="brand">
      <div><small>POSTING MAP</small><h1>ポスティング</h1></div>
      <button class="pill-btn" id="go-admin"><svg class="i" style="width:18px;height:18px"><use href="#i-gear"/></svg>管理</button>
    </div>
    <div id="home-msg"></div>
    <div class="sec">参加する配布</div>
    <div class="card" id="home-list"><div class="empty">読み込み中…</div></div>
    <div class="sec" id="home-done-h" style="display:none">終了した配布</div>
    <div class="card" id="home-done"></div>
  </div>
</section>

<!-- ============ ADMIN LIST ============ -->
<section id="adm" class="screen" style="overflow-y:auto">
  <div class="bar glass"><div class="bar-row">
    <button class="icon-btn" data-back="home"><svg class="i"><use href="#i-back"/></svg></button>
    <div class="bar-title"><b>配布の管理</b></div>
  </div></div>
  <div class="wrap" style="padding:16px 16px calc(var(--sb) + 30px)">
    <button class="btn p w" id="adm-new" style="display:flex;align-items:center;justify-content:center;gap:6px"><svg class="i"><use href="#i-plus"/></svg>新しい配布を作成</button>
    <div class="sec">進行中</div><div class="card" id="adm-active"></div>

   ※ Authorization: Bearer は付けない＝403の原因になる）
   ========================================================= */
const SB = 'https://efznjrngolysrdxnmurp.supabase.co';
const KEY = 'sb_publishable_kVLg2QozDdBIcLGcpvZwcw_VXwGyFrD';
const POLL_MS = 6000;
const COLORS = ['#007AFF','#FF9500','#FF2D55','#AF52DE','#5AC8FA','#A2845E','#5856D6','#FF3B30'];
const TI = {car:'🚗', bike:'🚲', walk:'🚶'};
const TL = {car:'車', bike:'自転車', walk:'徒歩'};
// 第1弾で使っていた固定の集合住宅（過去記録の表示用）
const LEGACY_APTS = {
  apt0:{name:'県営川越久下戸住宅',lat:35.904626,lng:139.526422},
  apt1:{name:'並木7-22',lat:35.904987,lng:139.517090},

/* ---------- utils ---------- */
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})){
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('--')) el.style.setProperty(k, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const icon = id => { const s = document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('class','i'); s.innerHTML = `<use href="#i-${id}"/>`; return s; };
const shortDate = d => { if(!d) return ''; const m = String(d).match(/\d{4}-(\d{2})-(\d{2})/); return m ? `${+m[1]}/${+m[2]}` : d; };
function dist(a, b){ // meters
  const R = 6371000, r = Math.PI/180, dLat = (b[0]-a[0])*r, dLng = (b[1]-a[1])*r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function pip(p, poly){ // 点がポリゴン内か
  let ins = false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++){
    const [yi,xi] = poly[i], [yj,xj] = poly[j];
    if (((yi > p[0]) !== (yj > p[0])) && (p[1] < (xj-xi)*(p[0]-yi)/(yj-yi) + xi)) ins = !ins;
  }
  return ins;
}
function overlaps(A, B){
  if (!A || !B || A.length < 3 || B.length < 3) return false;
  if (A.some(p => pip(p, B)) || B.some(p => pip(p, A))) return true;
  const o = (p,q,r) => Math.sign((q[1]-p[1])*(r[0]-p[0]) - (q[0]-p[0])*(r[1]-p[1]));
  for (let i=0; i<A.length; i++) for (let j=0; j<B.length; j++){
    const a=A[i], b=A[(i+1)%A.length], c=B[j], d=B[(j+1)%B.length];
    if (o(a,b,c) !== o(a,b,d) && o(c,d,a) !== o(c,d,b)) return true;
  }
  return false;
}
const center = poly => { const la = poly.map(p=>p[0]), ln = poly.map(p=>p[1]); return [(Math.min(...la)+Math.max(...la))/2, (Math.min(...ln)+Math.max(...ln))/2]; };

/* ---------- Supabase REST ---------- */
async function rest(path, {method='GET', body, prefer} = {}){
  const headers = {apikey: KEY, 'Content-Type': 'application/json'};
  if (prefer) headers.Prefer = prefer;
  let r;
  try {
    r = await fetch(`${SB}/rest/v1/${path}`, {method, headers, cache:'no-store', body: body ? JSON.stringify(body) : undefined});
  } catch(e){ const err = new Error('サーバーに接続できません'); err.net = true; throw err; }
  if (!r.ok){
    const t = await r.text().catch(()=> '');
    const err = new Error(`${r.status}: ${t.slice(0,300)}`); err.status = r.status; throw err;
  }
  const ct = r.headers.get('content-type') || '';
  return r.status === 204 || !ct.includes('json') ? null : r.json();
}
async function fetchAll(path){
  const out = [];
  for (let off = 0; ; off += 1000){
    const rows = await rest(`${path}${path.includes('?')?'&':'?'}limit=1000&offset=${off}`);
    out.push(...rows); if (rows.length < 1000) return out;
  }
}
// UNIQUE制約に頼らない upsert：PATCH→0件なら POST→409なら再PATCH
async function upsert(table, filter, body){
  const rows = await rest(`${table}?${filter}`, {method:'PATCH', body, prefer:'return=representation'});
  if (rows && rows.length) return;
  try { await rest(table, {method:'POST', body, prefer:'return=minimal'}); }
  catch(e){ if (e.status === 409) await rest(`${table}?${filter}`, {method:'PATCH', body, prefer:'return=minimal'}); else throw e; }
}

/* ---------- 送信キュー（圏外でも記録が消えない） ---------- */
const OB = 'pm2_outbox', FAIL = 'pm2_failed';
let outbox = ls.get(OB, []), failed = ls.get(FAIL, []), flushing = null;
function enqueue(op){
  if (op.t !== 'del') outbox = outbox.filter(o => !(o.table === op.table && o.key === op.key && o.t !== 'del')); // 同じ対象の未送信更新はまとめる
  outbox.push(op); ls.set(OB, outbox); flush();
}
function dropPending(table, key){ // 未送信の追加を取り消す（送信前に消された場合）
  const before = outbox.length;
  outbox = outbox.filter(o => !(o.table === table && o.key === key && o.t === 'ins'));
  ls.set(OB, outbox); return before !== outbox.length;
}
async function runOp(op){
  if (op.t === 'ins'){ try { await rest(op.table, {method:'POST', body:op.body, prefer:'return=minimal'}); } catch(e){ if (e.status !== 409) throw e; } }
  else if (op.t === 'ups') await upsert(op.table, op.filter, op.body);
  else if (op.t === 'del') await rest(`${op.table}?${op.filter}`, {method:'DELETE'});
}
function flush(){
  if (!flushing) flushing = drain().finally(() => { flushing = null; setNet(); render(); });
  return flushing;
}
async function drain(){
    while (outbox.length){
      const op = outbox[0];
      try { await runOp(op); }
      catch(e){
        if (e.net || e.status >= 500 || e.status === 408 || e.status === 429){ S.netErr = true; break; } // 通信不良 → 後で再送
        failed.push({...op, err: e.message, at: Date.now()}); ls.set(FAIL, failed.slice(-50));
        toast('保存できなかった記録があります（その他 → 同期状態）', {warn:true});
      }
      outbox.shift(); ls.set(OB, outbox);
      const e = stateMap(op.table)?.get(op.key); if (e) delete e._p;
    }
}

/* ---------- 状態 ---------- */
const S = {
  sessions: [], cur: null, me: null,
  markers: new Map(), recs: new Map(), apts: new Map(), gps: new Map(),
  past: null, pos: null, heading: null, lastSync: 0, netErr: false,
  view: ls.get('pm2_view', {past:true, pastPts:true, others:true, base:'pale'}),
};
const stateMap = t => ({markers:S.markers, apt_records:S.recs, dynamic_apts:S.apts})[t];
function overlayOutbox(){
  for (const op of outbox){
    const m = stateMap(op.table); if (!m || op.body?.session && op.body.session !== S.cur?.id || op.body?.session_id && op.body.session_id !== S.cur?.id) continue;
    if (op.t === 'del') m.delete(op.key); else m.set(op.key, {...(m.get(op.key)||{}), ...op.body, _p: 1});
  }
}
const statusOf = s => s.status || ((Date.now() - new Date(s.date || 0)) > 14*864e5 ? 'done' : 'active');
const members = () => S.cur?.members || [];
const memberById = id => members().find(m => m.id === id);
const targetOf = m => +m.target || (S.cur?.total && members().length ? Math.round(S.cur.total / members().length) : 0);

async function loadSessions(){
  const rows = await rest('posting_sessions?select=session_key,config,updated_at&order=updated_at.desc');
  S.sessions = rows.map(r => { try { const c = JSON.parse(r.config); c.id = c.id || r.session_key; return c; } catch(e){ return null; } }).filter(Boolean);
  return S.sessions;
}

/* ---------- 地図 ---------- */
const TILES = {
  pale:  ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', '淡色'],
  std:   ['https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', '標準'],
  photo: ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', '航空写真'],
};
function makeMap(el){
  const map = L.map(el, {zoomControl:false, attributionControl:true, doubleClickZoom:false, tapTolerance:12, maxZoom:20, zoomSnap:.5});
  map.attributionControl.setPrefix(false);
  map._base = null; setBase(map, S.view.base);
  if (matchMedia('(pointer:fine)').matches) L.control.zoom({position:'topright'}).addTo(map);
  map._cv = L.canvas({padding:.4, tolerance:4});
  // 2本指操作の直後のタップは無視（ピンチで誤記録しない）
  let multiUntil = 0; const c = map.getContainer();
  c.addEventListener('touchstart', e => { if (e.touches.length > 1) multiUntil = Date.now() + 600; }, {passive:true});
  c.addEventListener('touchend', e => { if (e.touches.length > 0 || Date.now() < multiUntil) multiUntil = Date.now() + 600; }, {passive:true});
  map._tapOk = () => Date.now() > multiUntil;
  return map;
}
function setBase(map, key){
  if (map._base) map.removeLayer(map._base);
  const [url] = TILES[key] || TILES.pale;
  map._base = L.tileLayer(url, {maxNativeZoom:18, maxZoom:20, attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'}).addTo(map);
}
const divIcon = (html, o={}) => L.divIcon({html, className:'', iconSize:null, ...o});

/* 前回までの配布データ（エリア・配布ピン・集合住宅） */
async function loadPast(exceptId){
  const k = enc(exceptId);
  const [pts, recs, apts] = await Promise.all([
    fetchAll(`markers?session=neq.${k}&select=session,lat,lng`).catch(()=>[]),
    fetchAll(`apt_records?session_id=neq.${k}&done=is.true&select=session_id,apt_id,apt_name,qty`).catch(()=>[]),
    fetchAll(`dynamic_apts?session_id=neq.${k}&select=session_id,apt_id,name,lat,lng`).catch(()=>[]),
  ]);
  const areas = [];
  for (const s of S.sessions){
    if (s.id === exceptId) continue;
    for (const m of s.members || []) if (m.area?.length >= 3) areas.push({poly:m.area, date:s.date, title:s.title, who:m.name});
  }
  const dateOf = id => S.sessions.find(s => s.id === id)?.date;
  const aptPos = new Map(apts.map(a => [a.session_id + '|' + a.apt_id, a]));
  const pastApts = recs.map(r => {
    const a = aptPos.get(r.session_id + '|' + r.apt_id) || LEGACY_APTS[r.apt_id];
    return a ? {name: a.name || r.apt_name, lat:a.lat, lng:a.lng, qty:r.qty, date:dateOf(r.session_id)} : null;
  }).filter(Boolean);
  return {areas, pts, apts: pastApts};
}
function drawPast(map, group, past, opts={}){
  group.clearLayers();
  if (!past) return;
  if (opts.areas !== false) for (const a of past.areas){
    const pg = L.polygon(a.poly, {color:'#3a3a3c', weight:2, dashArray:'6 4', fillColor:'url(#hatch)', fillOpacity:1, interactive:!!opts.tipAreas}).addTo(group);
    if (opts.tipAreas && matchMedia('(pointer:fine)').matches) pg.bindTooltip(`前回配布済み：${esc(a.title||'')}（${shortDate(a.date)}）${esc(a.who||'')}`, {sticky:true});
    L.marker(center(a.poly), {interactive:false, icon:divIcon(`<span class="pl">済 ${shortDate(a.date)} ${esc(a.who||'')}</span>`)}).addTo(group);
  }
  if (opts.pts !== false) for (const p of past.pts)
    L.circleMarker([p.lat,p.lng], {renderer:map._cv, radius:3.5, weight:1, color:'#fff', fillColor:'#636366', fillOpacity:.9, interactive:false}).addTo(group);
  for (const a of past.apts)
    L.marker([a.lat,a.lng], {interactive:!opts.tipAreas, icon:divIcon(`<span class="apt past">🏢 ${esc(a.name)} 済</span>`, {popupAnchor:[0,-30]})})
      .bindPopup(`<div class="pop-t">🏢 ${esc(a.name)}</div><div class="pop-s">前回 ${shortDate(a.date)} に ${a.qty}枚 配布済み</div>`)
      .addTo(group);
}

/* =========================================================
   UI 部品：シート・ダイアログ・トースト
   ========================================================= */
function openSheet(title, body, onClose){
  const sc = $('scrim'); sc.innerHTML = ''; $('toast').classList.remove('on');
  const close = () => { sc.classList.remove('on'); sc.innerHTML = ''; onClose && onClose(); };
  const sh = h('div', {class:'sheet', onclick:e => e.stopPropagation()},
    h('div', {class:'sheet-h'}, h('h3', {}, title), h('button', {class:'icon-btn', onclick:close, 'aria-label':'閉じる'}, icon('x'))),
    h('div', {class:'sheet-b'}, body));
  sc.append(sh); sc.onclick = close; sc.classList.add('on');
  return close;
}
function dialog(title, msg, buttons){
  return new Promise(res => {
    const sc = $('dscrim'); sc.innerHTML = '';
    const done = v => { sc.classList.remove('on'); sc.innerHTML = ''; res(v); };
    sc.append(h('div', {class:'dlg', onclick:e => e.stopPropagation()}, h('h4', {}, title), msg ? h('p', {}, msg) : null,
      h('div', {class:'btns'}, buttons.map(b => h('button', {class:'btn ' + (b.cls||''), onclick:() => done(b.v)}, b.label)))));
    sc.onclick = () => done(false); sc.classList.add('on');
  });
}
const confirmDlg = (title, msg, ok='OK', cls='p') => dialog(title, msg, [{label:'キャンセル', v:false}, {label:ok, v:true, cls}]);
const alertDlg = (title, msg) => dialog(title, msg, [{label:'OK', v:true, cls:'p'}]);
let toastT;
function toast(msg, {action, label='取り消す', ms=3500, warn=false} = {}){
  const t = $('toast'), a = $('toast-a');
  $('toast-m').textContent = msg; t.classList.toggle('warn', warn);
  a.style.display = action ? '' : 'none'; a.textContent = label;
  a.onclick = () => { t.classList.remove('on'); action && action(); };
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => { if (b.dataset.back === 'home') goHome(); }));

function netErrorBanner(e){
  return h('div', {class:'banner err'}, h('b', {}, 'サーバーに接続できません'), h('br'),

           : String(e?.message || e));
}

function adminActions(s){

  const close = openSheet(s.title || '無題', h('div', {},
    h('button', {class:'btn p w', onclick:() => { close(); openEditor(s); }}, 'エリア・メンバーを編集'),

      active ? '終了にする（次回は「前回配布済み」として表示）' : '進行中に戻す'),
    h('button', {class:'btn d w', onclick:async () => { close(); await deleteSession(s); }}, 'この配布を削除…')));

async function shareLink(s){
  const url = `${location.origin}${location.pathname}?s=${enc(s.id)}`;
  try { if (navigator.share) { await navigator.share({title:s.title, url}); return; } } catch(e){ return; }
  try { await navigator.clipboard.writeText(url); toast('リンクをコピーしました'); } catch(e){ alertDlg('スタッフ用リンク', url); }

function fitEditor(){

function conflictsOf(m){
  if (!m.area) return [];
  const out = [];
  for (const a of E.past?.areas || []) if (overlaps(m.area, a.poly)) out.push(`前回配布（${shortDate(a.date)} ${a.who||''}）`);
  for (const o of E.cfg.members) if (o !== m && overlaps(m.area, o.area)) out.push(`${o.name}さんのエリア`);

}
function renderZones(){
  E.zoneG.clearLayers();
  for (const m of E.cfg.members){
    if (!m.area || (E.draw && E.draw.m === m)) continue;
    const sel = E.sel === m;
    const pg = L.polygon(m.area, {color:m.color, weight:sel?4:2.5, fillColor:m.color, fillOpacity:sel?.22:.14}).addTo(E.zoneG);
    pg.on('click', () => { if (!E.draw){ E.sel = m; renderZones(); renderPanel(); } });
    L.marker(center(m.area), {interactive:false, icon:divIcon(`<span class="zl" style="--c:${m.color}">${TI[m.transport]||''} ${esc(m.name)}</span>`)}).addTo(E.zoneG);
    if (sel && !E.draw) m.area.forEach((p, i) => {
      const vh = L.marker(p, {draggable:true, icon:divIcon(`<div class="vh" style="--c:${m.color}"></div>`)}).addTo(E.zoneG);
      vh.on('drag', ev => { const ll = ev.target.getLatLng(); m.area[i] = [ll.lat, ll.lng]; pg.setLatLngs(m.area); });
      vh.on('dragend', () => { E.dirty = true; renderZones(); renderPanel(); });

}
function renderDraw(){

let syncing = false;
async function sync(){
  if (!S.cur || syncing) return; syncing = true;
  const id = S.cur.id, k = enc(id);
  try {
    await flush();
    const [m, r, a, g, cfg] = await Promise.all([
      fetchAll(`markers?session=eq.${k}&select=id,member_id,lat,lng,created_at`),
      rest(`apt_records?session_id=eq.${k}&select=apt_id,apt_name,qty,done,member_id,member_name`),
      rest(`dynamic_apts?session_id=eq.${k}&select=apt_id,name,lat,lng,units,default_qty`),
      rest(`gps_positions?session=eq.${k}&select=member_id,lat,lng,updated_at`),
      rest(`posting_sessions?session_key=eq.${k}&select=config`),
    ]);
    if (S.cur?.id !== id) return;
    if (cfg?.[0]?.config && cfg[0].config !== S.curRaw){ // 管理者がエリア等を変更したら反映
      try { const c = JSON.parse(cfg[0].config); c.id = c.id || id; if (S.curRaw) toast('管理者が配布設定を更新しました'); S.cur = c; S.curRaw = cfg[0].config;
            const i = S.sessions.findIndex(x => x.id === id); if (i >= 0) S.sessions[i] = c; } catch(e){}
    }
    S.markers = new Map(m.map(x => [x.id, x])); S.recs = new Map(r.map(x => [x.apt_id, x]));
    S.apts = new Map(a.map(x => [x.apt_id, x])); S.gps = new Map(g.map(x => [x.member_id, x]));
    overlayOutbox(); S.lastSync = Date.now(); S.netErr = false;
  } catch(e){ S.netErr = true; }
  finally { syncing = false; setNet(); render(); }
}

/* ---------- 記録（タップ） ---------- */
function onMapTap(e){
  if (!T.map._tapOk()) return;
  if (T.placing){ const cb = T.placing; T.placing = null; $('st-note').style.display = ''; cb(e.latlng); return; }
  if (!S.me){ pickMe(); return; }
  const id = uid('k'), body = {id, session:S.cur.id, member_id:S.me, lat:e.latlng.lat, lng:e.latlng.lng};
  S.markers.set(id, {...body, _p:1}); render();
  enqueue({t:'ins', table:'markers', key:id, body});
  navigator.vibrate && navigator.vibrate(12);
  const inPast = S.past?.areas.some(a => pip([body.lat, body.lng], a.poly));
  toast(inPast ? '⚠ 前回配布済みのエリアです（記録はしました）' : '✓ 配布済みにしました', {warn:inPast, action:() => removeMarker(id)});
}
function removeMarker(id){
  S.markers.delete(id);
  if (!dropPending('markers', id)) enqueue({t:'del', table:'markers', key:id, filter:`id=eq.${enc(id)}`});
  T.map.closePopup(); render();
}
function markerPopup(id){

  const t = r?.created_at ? new Date(r.created_at).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) : '';

    h('button', {class:'btn d w', onclick:() => removeMarker(id)}, 'この記録を取り消す'));
}

  if (!S.cur || !T.map) return;
  // 配布ピン（canvas で軽量）

    const col = memberById(r.member_id)?.color || '#8e8e93';
    const style = {radius:7.5, weight:2.5, color: r._p ? '#34c759' : '#fff', fillColor: r._p ? '#fff' : '#34c759', fillOpacity:1};

function doneOf(m){

}

function renderOthers(){

    l.unbindTooltip(); l.bindTooltip(age > 60e3 ? `${Math.round(age/60e3)}分前の位置` : '現在地', {direction:'top', offset:[0,-18]});

}

/* ---------- 現在地 ---------- */
function onPos(p){
  const ll = [p.coords.latitude, p.coords.longitude];
  S.pos = ll;
  if (!T.meM){
    T.meM = L.marker(ll, {zIndexOffset:1000, interactive:false, icon:divIcon('<div class="me-dot"><i></i><b></b></div>')}).addTo(T.gpsG);
  } else T.meM.setLatLng(ll);
  applyHeading(); sendGps();
}
function sendGps(force){
  if (!S.cur || !S.me || !S.pos) return;
  const now = Date.now(), last = T.lastSent;
  if (!force && last && now - last.t < 15000 && dist(last.p, S.pos) < 25) return;
  T.lastSent = {t:now, p:S.pos};
  const body = {session:S.cur.id, member_id:S.me, lat:S.pos[0], lng:S.pos[1], updated_at:new Date().toISOString()};
  upsert('gps_positions', `session=eq.${enc(S.cur.id)}&member_id=eq.${enc(S.me)}`, body).catch(() => { T.lastSent = null; });
}
function applyHeading(){
  const i = T.meM?.getElement()?.querySelector('i'); if (!i) return;
  if (S.heading == null){ i.style.display = 'none'; return; }
  i.style.display = 'block'; i.style.transform = `rotate(${S.heading}deg)`;
}
function onOrient(e){
  const hd = e.webkitCompassHeading ?? (e.absolute && e.alpha != null ? 360 - e.alpha : null);
  if (hd != null){ S.heading = Math.round(hd); applyHeading(); }
}
let orientOn = false;
$('st-loc').onclick = async () => {
  if (!orientOn){
    orientOn = true;
    try { if (typeof DeviceOrientationEvent?.requestPermission === 'function'){ if (await DeviceOrientationEvent.requestPermission() === 'granted') addEventListener('deviceorientation', onOrient); }
          else addEventListener('deviceorientationabsolute', onOrient); } catch(e){}
  }
  if (S.pos) T.map.setView(S.pos, Math.max(T.map.getZoom(), 17));
  else toast(navigator.geolocation ? '現在地を取得中です…（位置情報の許可を確認してください）' : 'この端末は位置情報に対応していません', {warn:true});
};

async function findApts(){
  if (T.map.getZoom() < 15){ toast('もう少し地図を拡大してから探してください', {warn:true}); return; }
  const b = T.map.getBounds(), bb = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
  toast('探しています…', {ms:20000});
  try {
    const q = `[out:json][timeout:25];(way["building"="apartments"](${bb});relation["building"="apartments"](${bb});node["building"="apartments"](${bb}););out center tags;`;
    const r = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:'data=' + enc(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}});
    const els = (await r.json()).elements || [];
    T.candG.clearLayers(); let n = 0;
    for (const el of els){
      const lat = el.lat ?? el.center?.lat, lng = el.lon ?? el.center?.lon; if (lat == null) continue;
      const near = arr => arr.some(x => dist([x.lat, x.lng], [lat, lng]) < 35);
      if (near([...S.apts.values()])) continue;
      const pastHit = near(S.past?.apts || []);
      const tg = el.tags || {}, nm = tg.name || '集合住宅', units = parseInt(tg['building:flats']) || null;
      const l = L.marker([lat, lng], {icon:divIcon(`<span class="apt ${pastHit ? 'past' : 'cand'}">🏢 ${esc(nm)}${pastHit ? ' 済' : '？'}</span>`, {popupAnchor:[0,-32]})}).addTo(T.candG);
      l._c = {lat, lng};
      l.bindPopup(() => h('div', {}, h('div', {class:'pop-t'}, `🏢 ${nm}`), h('div', {class:'pop-s'}, pastHit ? '前回配布済みの可能性があります' : '未登録の集合住宅（地図データより）'),
        h('button', {class:'btn g w', onclick:() => { T.map.closePopup(); addAptAt({lat, lng}, {name: tg.name || '', units}); }}, '登録する'), navBtn(lat, lng)));
      n++;
    }
    toast(n ? `${n}件見つかりました（オレンジ点線のピン）` : 'この範囲では見つかりませんでした');
  } catch(e){ toast('地図データを取得できませんでした', {warn:true}); }
}

  for (const a of S.apts.values()){ const r = S.recs.get(a.apt_id); rows.push(['集合住宅', r?.member_name || '', a.name, r?.done ? r.qty : 0, a.lat, a.lng, '']); }
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = h('a', {href: URL.createObjectURL(new Blob([csv], {type:'text/csv'})), download: `${S.cur.title || 'posting'}_${new Date().toISOString().slice(0,10)}.csv`});
  document.body.append(a); a.click(); a.remove();
}

  const sid = new URLSearchParams(location.search).get('s');
  if (sid){ try { await loadSessions(); openStaff(sid); return; } catch(e){} }
  goHome();
  if (outbox.length) flush();
})();
</script>
