<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PostingMap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<style>
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface2: #f5f5f7;
  --border: rgba(0,0,0,.08);
  --border2: rgba(0,0,0,.14);
  --text: #1d1d1f;
  --text2: #6e6e73;
  --text3: #aeaeb2;
  --accent: #0071e3;
  --accent2: #34c759;
  --danger: #ff3b30;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 2px 20px rgba(0,0,0,.08);
  --shadow-lg: 0 8px 40px rgba(0,0,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* ============ TOP SCREEN ============ */
#top-screen{position:absolute;inset:0;z-index:5000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;transition:opacity .4s,transform .4s}
#top-screen.hide{opacity:0;transform:scale(.97);pointer-events:none}
.top-logo{font-size:13px;font-weight:500;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;margin-bottom:12px}
.top-title{font-size:32px;font-weight:600;color:var(--text);letter-spacing:-.02em;margin-bottom:6px}
.top-sub{font-size:15px;color:var(--text2);margin-bottom:48px;text-align:center;line-height:1.5}
.top-btn{width:100%;max-width:340px;padding:16px;border-radius:var(--radius);border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;margin-bottom:12px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:-.01em}
.top-btn.primary{background:var(--accent);color:#fff}
.top-btn.primary:active{background:#0062c4;transform:scale(.98)}
.top-btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border2)}
.top-btn.secondary:active{background:var(--surface2);transform:scale(.98)}
.top-btn .btn-icon{font-size:20px}
.top-version{margin-top:32px;font-size:12px;color:var(--text3)}

/* ============ ADMIN SCREEN ============ */
#admin-screen{position:absolute;inset:0;z-index:4000;background:var(--bg);display:none;flex-direction:column}
#admin-screen.show{display:flex}

#admin-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:12px;flex-shrink:0;backdrop-filter:blur(20px)}
.admin-back{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text2)}
.admin-back:active{background:var(--border)}
#admin-header h2{font-size:17px;font-weight:600;flex:1;letter-spacing:-.01em}
.admin-save-btn{padding:7px 16px;border-radius:99px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.admin-save-btn:active{background:#0062c4}
.admin-save-btn:disabled{background:var(--border2);color:var(--text3)}

/* Admin tab bar */
#admin-tabs{display:flex;background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0;padding:0 20px;gap:0}
.admin-tab{flex:1;padding:10px 4px;font-size:13px;font-weight:500;color:var(--text2);border:none;background:none;cursor:pointer;position:relative;font-family:inherit}
.admin-tab.on{color:var(--accent);font-weight:600}
.admin-tab.on::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:2px;background:var(--accent);border-radius:2px}

/* Admin content */
#admin-content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* Session panel */
#panel-session{flex:1;overflow-y:auto;padding:20px}
.section-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;margin-top:20px}
.section-label:first-child{margin-top:0}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.card-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-row:last-child{border-bottom:none}
.card-row label{font-size:14px;color:var(--text2);min-width:72px;flex-shrink:0}
.card-input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;color:var(--text);background:transparent;min-width:0}
.card-input::placeholder{color:var(--text3)}

/* Color selector */
.color-row{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s}
.color-dot.sel{border-color:var(--text);transform:scale(1.15)}

/* Member list */
.member-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.member-item:last-child{border-bottom:none}
.member-color-bar{width:4px;height:36px;border-radius:2px;flex-shrink:0}
.member-info{flex:1;min-width:0}
.member-name{font-size:15px;font-weight:500}
.member-area{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-del{width:28px;height:28px;border-radius:50%;border:none;background:var(--surface2);color:var(--danger);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.member-del:active{background:#fee}
.add-member-btn{width:100%;padding:13px;border-radius:var(--radius);border:1.5px dashed var(--border2);background:transparent;color:var(--accent);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:8px}
.add-member-btn:active{background:var(--surface)}

/* Map panel */
#panel-map{flex:1;position:relative;display:none}
#panel-map.show{display:block}
#admin-map{position:absolute;inset:0}
#map-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;background:rgba(0,0,0,.72);color:#fff;padding:8px 18px;border-radius:99px;font-size:12px;white-space:nowrap;pointer-events:none;backdrop-filter:blur(8px)}

/* ============ STAFF SCREEN ============ */
#staff-screen{position:absolute;inset:0;z-index:3000;background:var(--bg);display:none;flex-direction:column}
#staff-screen.show{display:flex}

/* Staff: member picker */
#member-picker{position:absolute;inset:0;z-index:500;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#member-picker.hide{display:none}
#picker-sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:20px 20px 40px;animation:slideUp .35s cubic-bezier(.32,.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.picker-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 20px}
.picker-title{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.picker-sub{font-size:14px;color:var(--text2);margin-bottom:24px}
.picker-grid{display:flex;flex-direction:column;gap:10px}
.picker-btn{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;transition:all .12s;font-family:inherit}
.picker-btn:active{transform:scale(.98)}
.picker-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.picker-info{flex:1}
.picker-name{font-size:16px;font-weight:600;color:var(--text)}
.picker-detail{font-size:12px;color:var(--text2);margin-top:2px}
.picker-arrow{color:var(--text3);font-size:18px}

/* Staff: header */
#staff-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;flex-shrink:0;backdrop-filter:blur(20px);z-index:100}
.staff-title{font-size:15px;font-weight:600;flex:1;letter-spacing:-.01em}
#sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background .3s;flex-shrink:0}
#sync-dot.green{background:var(--accent2)}
#sync-dot.red{background:var(--danger)}

/* remain bar */
#remain-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.rb{flex:1;padding:6px 4px;text-align:center;cursor:pointer;border-right:1px solid var(--border);transition:background .12s}
.rb:last-child{border-right:none}
.rb.active{background:var(--surface2)}
.rb .rn{font-size:18px;font-weight:700;display:block;letter-spacing:-.02em}
.rb .rl{font-size:9px;color:var(--text2);display:block;margin-top:1px}

#staff-map{position:absolute;left:0;right:0}

/* staff bottom */
#staff-bot{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);height:60px;display:flex;align-items:center;z-index:100}
.sbb{flex:1;height:100%;border:none;background:none;font-size:10px;color:var(--text2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:inherit}
.sbb .si{font-size:18px;line-height:1}
.sbb:active{background:var(--surface2)}
.sbb-sep{width:1px;height:28px;background:var(--border)}

#gps-btn{position:absolute;right:16px;z-index:200;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
#gps-btn:active{background:var(--surface2)}

/* staff hint */
#staff-hint{position:absolute;z-index:200;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:6px 16px;border-radius:99px;font-size:11px;white-space:nowrap;pointer-events:none;backdrop-filter:blur(8px);transition:opacity .5s}

/* ============ MODAL ============ */
.modal-bg{display:none;position:absolute;inset:0;z-index:6000;background:rgba(0,0,0,.4);align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal-box{background:var(--surface);border-radius:20px;padding:24px;width:88%;max-width:360px;box-shadow:var(--shadow-lg);animation:popIn .25s cubic-bezier(.32,.72,0,1)}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:18px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.modal-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);font-size:15px;font-family:inherit;outline:none;margin-bottom:10px;transition:border-color .15s}
.modal-input:focus{border-color:var(--accent)}
.modal-row{display:flex;gap:10px;margin-bottom:10px}
.modal-btn{flex:1;padding:13px;border-radius:var(--radius-sm);border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.modal-btn.primary{background:var(--accent);color:#fff}
.modal-btn.primary:active{background:#0062c4}
.modal-btn.ghost{background:var(--surface2);color:var(--text)}
.modal-btn.ghost:active{background:var(--border)}
.modal-btn.danger{background:#fff1f0;color:var(--danger)}

/* stat modal */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border:none}
.stat-name{display:flex;align-items:center;gap:8px;font-size:14px}
.stat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.stat-val{font-size:13px;font-weight:600;color:var(--text)}
.stat-rem{font-size:11px;color:var(--text2)}
.big-pct{font-size:48px;font-weight:700;text-align:center;letter-spacing:-.04em;margin-bottom:4px}
.big-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:20px}

/* leg */
#staff-leg{position:absolute;left:12px;z-index:199;background:rgba(255,255,255,.92);border-radius:var(--radius-sm);padding:8px 12px;font-size:11px;border:1px solid var(--border);backdrop-filter:blur(10px);line-height:2}
.leg-row{display:flex;align-items:center;gap:6px}
.leg-dash{width:18px;height:3px;border-radius:2px;flex-shrink:0}

/* session sessions list */
.session-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.session-item:last-child{border-bottom:none}
.session-item:active{background:var(--surface2)}
.session-icon{width:40px;height:40px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.session-info{flex:1;min-width:0}
.session-name{font-size:15px;font-weight:600}
.session-meta{font-size:12px;color:var(--text2);margin-top:2px}
.session-arr{color:var(--text3);font-size:16px}
.session-del{padding:6px 12px;border-radius:99px;border:none;background:#fff1f0;color:var(--danger);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0}
</style>
</head>
<body>

<!-- ============ TOP SCREEN ============ -->
<div id="top-screen">
  <div class="top-logo">PostingMap</div>
  <h1 class="top-title">ポスティング管理</h1>
  <p class="top-sub">エリアを設定して<br>チームで効率よく配布</p>
  <button class="top-btn primary" onclick="showAdmin()">
    <span class="btn-icon">⚙️</span>管理者モード
  </button>
  <button class="top-btn secondary" onclick="showStaff()">
    <span class="btn-icon">📮</span>配布スタッフとして参加
  </button>
  <div class="top-version">PostingMap v2.0</div>
</div>

<!-- ============ ADMIN SCREEN ============ -->
<div id="admin-screen">
  <div id="admin-header">
    <button class="admin-back" onclick="backToTop()">←</button>
    <h2>管理者設定</h2>
    <button class="admin-save-btn" id="admin-save-btn" onclick="saveSession()">保存</button>
  </div>
  <div id="admin-tabs">
    <button class="admin-tab on" onclick="switchAdminTab('session')">📋 セッション</button>
    <button class="admin-tab" onclick="switchAdminTab('map')">🗺️ エリア設定</button>
  </div>
  <div id="admin-content">
    <!-- セッション設定 -->
    <div id="panel-session">
      <div class="section-label">セッション情報</div>
      <div class="card">
        <div class="card-row">
          <label>タイトル</label>
          <input class="card-input" id="sess-title" placeholder="例: 川越市ポスティング2024" maxlength="40">
        </div>
        <div class="card-row">
          <label>日付</label>
          <input class="card-input" id="sess-date" type="date">
        </div>
        <div class="card-row">
          <label>合計枚数</label>
          <input class="card-input" id="sess-total" type="number" placeholder="例: 1000" min="1">
        </div>
      </div>

      <div class="section-label">担当メンバー</div>
      <div class="card" id="member-list-card">
        <!-- 動的生成 -->
      </div>
      <button class="add-member-btn" onclick="showAddMember()">＋ メンバーを追加</button>

      <div class="section-label">保存済みセッション</div>
      <div class="card" id="saved-sessions-card">
        <!-- 動的生成 -->
      </div>
    </div>

    <!-- エリア設定マップ -->
    <div id="panel-map">
      <div id="admin-map"></div>
      <div id="map-hint">メンバーを選択してエリアを描いてください</div>
    </div>
  </div>
</div>

<!-- ============ STAFF SCREEN ============ -->
<div id="staff-screen">
  <!-- Member picker sheet -->
  <div id="member-picker">
    <div id="picker-sheet">
      <div class="picker-handle"></div>
      <div class="picker-title">担当者を選ぶ</div>
      <div class="picker-sub" id="picker-session-name">セッションを選択してください</div>
      <div class="picker-grid" id="picker-grid"></div>
    </div>
  </div>

  <div id="staff-header">
    <button style="width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);cursor:pointer;font-size:14px" onclick="showMemberPicker()">←</button>
    <div class="staff-title" id="staff-title">PostingMap</div>
    <div id="sync-dot"></div>
    <div id="staff-badge" style="font-size:12px;font-weight:600;color:var(--text2);margin-left:4px">0/0</div>
  </div>

  <div id="remain-bar"></div>
  <div id="staff-map"></div>
  <div id="gps-btn" onclick="centerGPS()">🎯</div>
  <div id="staff-hint">地図をタップして配布済みマーク</div>

  <div id="staff-leg">
    <div class="leg-row"><div class="leg-dash" style="background:#22c55e"></div>配布済み</div>
    <div class="leg-row"><span style="font-size:12px">🏢</span> 集合住宅</div>
    <div class="leg-row"><span style="font-size:12px">🏭</span> 会社(拡大時)</div>
  </div>

  <div id="staff-bot">
    <button class="sbb" onclick="showStatModal()"><span class="si">📊</span>進捗</button>
    <div class="sbb-sep"></div>
    <button class="sbb" onclick="undoLast()"><span class="si">↩️</span>戻す</button>
    <div class="sbb-sep"></div>
    <button class="sbb" onclick="resetMyArea()"><span class="si">🗑️</span>リセット</button>
    <div class="sbb-sep"></div>
    <button class="sbb" onclick="exportCSV()"><span class="si">💾</span>CSV</button>
  </div>
</div>

<!-- Add Member Modal -->
<div class="modal-bg" id="add-member-modal">
  <div class="modal-box">
    <div class="modal-title">メンバーを追加</div>
    <div class="modal-sub">担当者の名前と移動手段を設定します</div>
    <input class="modal-input" id="new-member-name" placeholder="例: 田中さん" maxlength="20">
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button id="transport-car" class="modal-btn ghost" onclick="selectTransport('car')" style="font-size:13px">🚗 車</button>
      <button id="transport-bike" class="modal-btn ghost" onclick="selectTransport('bike')" style="font-size:13px">🚲 自転車</button>
      <button id="transport-walk" class="modal-btn ghost" onclick="selectTransport('walk')" style="font-size:13px">🚶 徒歩</button>
    </div>
    <div class="section-label" style="margin-top:0;margin-bottom:10px">カラー</div>
    <div class="color-row" id="color-picker" style="padding:0;margin-bottom:16px"></div>
    <div class="modal-row">
      <button class="modal-btn ghost" onclick="hideAddMember()">キャンセル</button>
      <button class="modal-btn primary" onclick="addMember()">追加</button>
    </div>
  </div>
</div>

<!-- Stat Modal -->
<div class="modal-bg" id="stat-modal" onclick="hideStatModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">📊 進捗レポート</div>
    <div class="big-pct" id="stat-pct">0%</div>
    <div class="big-sub" id="stat-sub">集計中...</div>
    <div id="stat-rows"></div>
    <div style="margin-top:16px">
      <button class="modal-btn ghost" style="width:100%" onclick="hideStatModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-bg" id="confirm-modal">
  <div class="modal-box">
    <div class="modal-title" id="confirm-title">確認</div>
    <div class="modal-sub" id="confirm-msg">よろしいですか？</div>
    <div class="modal-row">
      <button class="modal-btn ghost" onclick="hideConfirm()">キャンセル</button>
      <button class="modal-btn danger" id="confirm-ok">削除</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// Supabase
// ============================================================
const SB_URL = 'https://efznjrngolysrdxnmurp.supabase.co';
const SB_KEY = 'sb_publishable_kVLg2QozDdBIcLGcpvZwcw_VXwGyFrD';

async function sb(path, opts = {}) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=minimal',
      ...opts.headers
    }, ...opts
  });
  if (opts.json && r.ok) return r.json();
  return r;
}

// ============================================================
// COLORS
// ============================================================
const COLORS = ['#e53e3e','#c05621','#d69e2e','#276749','#2b6cb0','#553c9a','#b83280','#2c7a7b','#1a365d','#744210'];
const TRANSPORT_ICON = { car:'🚗', bike:'🚲', walk:'🚶' };

// ============================================================
// STATE
// ============================================================
let sessions = []; // 保存済みセッション
let currentSession = null; // { id, title, date, total, members:[{id,name,transport,color,area:null}] }
let editingMembers = []; // 管理画面の編集中メンバーリスト
let newMemberTransport = 'car';
let newMemberColor = COLORS[0];

let map = null;

let bizLayers = [], bizFetched = {};

function switchAdminTab(tab) {
  document.querySelectorAll('.admin-tab').forEach((t,i) => t.classList.toggle('on', (i===0&&tab==='session')||(i===1&&tab==='map')));
  document.getElementById('panel-session').style.display = tab === 'session' ? 'block' : 'none';

// ============================================================
// ADMIN: MAP
// ============================================================
let drawControl = null;
let adminZones = {}; // memberId -> L.polygon

function initAdminMap() {
  if (adminMap) return;
  adminMap = L.map('admin-map', { zoomControl: true, attributionControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20 }).addTo(adminMap);
  adminMap.setView([35.910, 139.490], 13);

  // Draw control
  const drawnItems = new L.FeatureGroup().addTo(adminMap);
  drawControl = new L.Control.Draw({
    draw: {
      polygon: { shapeOptions: { color: '#0071e3', fillOpacity: 0.15, weight: 2 } },
      rectangle: { shapeOptions: { color: '#0071e3', fillOpacity: 0.15, weight: 2 } },
      circle: false, marker: false, polyline: false, circlemarker: false
    },
    edit: { featureGroup: drawnItems }
  }).addTo(adminMap);

  adminMap.on(L.Draw.Event.CREATED, e => {
    const layer = e.layer;
    const coords = layer.getLatLngs()[0].map(ll => [ll.lat, ll.lng]);
    // どのメンバーに割り当てるか確認
    showAssignZone(coords, layer);
  });
}

let pendingZoneCoords = null;
let pendingZoneLayer = null;

function showAssignZone(coords, layer) {
  pendingZoneCoords = coords;
  pendingZoneLayer = layer;
  // メンバー選択ダイアログ
  const names = editingMembers.map((m,i)=>`<option value="${i}">${TRANSPORT_ICON[m.transport]} ${m.name}</option>`).join('');
  if (!names) { alert('先にメンバーを追加してください'); return; }
  const html = `<div class="modal-bg show" id="assign-modal" style="z-index:9000">
    <div class="modal-box">
      <div class="modal-title">エリアを割り当て</div>
      <div class="modal-sub">このエリアをどのメンバーに割り当てますか？</div>
      <select id="assign-select" style="width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);font-size:15px;font-family:inherit;margin-bottom:16px;outline:none">${names}</select>
      <div class="modal-row">
        <button class="modal-btn ghost" onclick="document.getElementById('assign-modal').remove()">キャンセル</button>
        <button class="modal-btn primary" onclick="assignZone()">割り当て</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

function assignZone() {
  const idx = parseInt(document.getElementById('assign-select').value);
  const m = editingMembers[idx];
  m.area = pendingZoneCoords;
  document.getElementById('assign-modal').remove();
  // 既存の同メンバーゾーンを削除
  if (adminZones[m.id]) adminMap.removeLayer(adminZones[m.id]);
  // 新しいゾーンを描画
  const poly = L.polygon(m.area, { color: m.color, fillColor: m.color, fillOpacity: 0.15, weight: 2.5, dashArray: '6 4' }).addTo(adminMap);
  const label = L.divIcon({
    html: `<div style="background:rgba(255,255,255,.9);border:1.5px solid ${m.color};border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700;color:${m.color};white-space:nowrap">${TRANSPORT_ICON[m.transport]} ${m.name}</div>`,
    iconSize: [120, 26], iconAnchor: [60, 13], className: ''
  });
  const lats = m.area.map(c=>c[0]), lngs = m.area.map(c=>c[1]);
  const clat = (Math.min(...lats)+Math.max(...lats))/2;
  const clng = (Math.min(...lngs)+Math.max(...lngs))/2;
  L.marker([clat, clng], { icon: label, interactive: false }).addTo(adminMap);
  adminZones[m.id] = poly;
  renderMemberList();
}

// ============================================================
// ADMIN: SESSION
// ============================================================
function renderMemberList() {
  const card = document.getElementById('member-list-card');
  if (!editingMembers.length) {
    card.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">メンバーがいません</div>`;
    return;
  }
  card.innerHTML = editingMembers.map((m,i) => `
    <div class="member-item">
      <div class="member-color-bar" style="background:${m.color}"></div>
      <div class="member-info">
        <div class="member-name">${TRANSPORT_ICON[m.transport]} ${m.name}</div>
        <div class="member-area">${m.area ? `✓ エリア設定済み` : '⚠ エリア未設定 — 「エリア設定」タブで描いてください'}</div>
      </div>
      <button class="member-del" onclick="deleteMember(${i})">✕</button>
    </div>
  `).join('');
}

function renderSavedSessions() {
  const card = document.getElementById('saved-sessions-card');
  if (!sessions.length) {
    card.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">保存済みセッションなし</div>`;
    return;
  }
  card.innerHTML = sessions.map((s,i) => `
    <div class="session-item">
      <div class="session-icon">📋</div>
      <div class="session-info" onclick="loadSession(${i})">
        <div class="session-name">${s.title || '無題'}</div>
        <div class="session-meta">${s.date || ''} / ${s.members.length}名 / ${s.total||'?'}枚</div>
      </div>
      <button class="session-del" onclick="deleteSession(${i})">削除</button>
      <div class="session-arr" onclick="loadSession(${i})">›</div>
    </div>
  `).join('');
}

function loadSession(i) {
  const s = sessions[i];
  document.getElementById('sess-title').value = s.title || '';
  document.getElementById('sess-date').value = s.date || '';
  document.getElementById('sess-total').value = s.total || '';
  editingMembers = JSON.parse(JSON.stringify(s.members));
  renderMemberList();
  // マップにゾーンを再描画
  if (adminMap) {
    editingMembers.forEach(m => {
      if (m.area) {
        const poly = L.polygon(m.area, { color: m.color, fillColor: m.color, fillOpacity: 0.15, weight: 2.5, dashArray: '6 4' }).addTo(adminMap);
        adminZones[m.id] = poly;
      }
    });
  }
}

function deleteSession(i) {
  showConfirm('セッションを削除', `「${sessions[i].title||'無題'}」を削除しますか？`, () => {
    sessions.splice(i, 1);
    saveSessions();
    renderSavedSessions();
  });
}

function saveSession() {
  const title = document.getElementById('sess-title').value.trim();
  if (!title) { alert('タイトルを入力してください'); return; }
  if (!editingMembers.length) { alert('メンバーを1人以上追加してください'); return; }

  const total = parseInt(document.getElementById('sess-total').value) || 0;
  const perMember = total && editingMembers.length ? Math.round(total / editingMembers.length) : 0;

  const session = {
    id: 'sess_' + Date.now(),
    title,
    date: document.getElementById('sess-date').value,
    total,
    members: editingMembers.map((m, i) => ({
      ...m,
      target: perMember,
      order: i
    }))
  };

  // 同名セッションは上書き
  const existing = sessions.findIndex(s => s.title === title);
  if (existing >= 0) sessions[existing] = session;
  else sessions.unshift(session);

  saveSessions();
  renderSavedSessions();

  // Supabaseにも保存
  sb('sessions', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=minimal',
    headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ id: session.id, data: JSON.stringify(session) })
  }).catch(() => {});

  alert(`「${title}」を保存しました！\nスタッフ側でこのセッションを選んで開始できます。`);
}

function addMember() {
  const name = document.getElementById('new-member-name').value.trim();
  if (!name) { alert('名前を入力してください'); return; }
  editingMembers.push({
    id: 'member_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    name, transport: newMemberTransport, color: newMemberColor, area: null, target: 0

  renderMemberList();

function deleteMember(i) {

}

// ============================================================
// LOCAL STORAGE
// ============================================================
function saveSessions() {
  try { localStorage.setItem('pm_sessions_v2', JSON.stringify(sessions)); } catch(e) {}
}

function loadSessions() {
  try {
    const raw = localStorage.getItem('pm_sessions_v2');
    sessions = raw ? JSON.parse(raw) : [];
  } catch(e) { sessions = []; }
  // Supabaseからも取得（非同期）
  sb('sessions?select=*', { method: 'GET', json: true, prefer: '' })
    .then(data => {
      if (!Array.isArray(data)) return;
      data.forEach(row => {
        try {
          const s = JSON.parse(row.data);
          if (!sessions.find(x => x.id === s.id)) sessions.unshift(s);
        } catch(e) {}
      });
      saveSessions();
      renderSavedSessions();
      renderPickerGrid();
    }).catch(() => {});
}

  if (!map) initStaffMap();

    map.setView([35.910, 139.490], 14);

function initStaffMap() {
  map = L.map('staff-map', { zoomControl: true, attributionControl: false, tapTolerance: 15 });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, minZoom: 10 }).addTo(map);

  map.on('zoomend', updateBizVisibility);

  map.on('click', e => {
    if (isTouching) return;
    addMarker(myMemberIdx, e.latlng);
  });

  const md = document.getElementById('staff-map');
  md.addEventListener('touchstart', e => {
    if (e.touches.length >= 2) isTouching = true;
  }, { passive: true });
  md.addEventListener('touchend', e => {
    if (e.touches.length === 0) setTimeout(() => { isTouching = false; }, 300);
  }, { passive: true });
}

// ============================================================
// ZONES
// ============================================================
function drawZones() {
  zonePolys.forEach(p => { try { map.removeLayer(p); } catch(e) {} });
  zonePolys = [];
  if (!currentSession) return;
  currentSession.members.forEach((m, i) => {
    if (!m.area) return;
    const active = i === myMemberIdx;
    const poly = L.polygon(m.area, {
      color: m.color, fillColor: m.color,
      fillOpacity: active ? 0.12 : 0.04,
      weight: active ? 2.5 : 1.5,
      dashArray: '7 5', opacity: active ? 1 : 0.5
    }).addTo(map);
    const lats = m.area.map(c=>c[0]), lngs = m.area.map(c=>c[1]);
    const clat = (Math.min(...lats)+Math.max(...lats))/2;
    const clng = (Math.min(...lngs)+Math.max(...lngs))/2;
    const done = markers[i] ? markers[i].length : 0;
    const rem = m.target ? Math.max(0, m.target - done) : '?';
    const lIcon = L.divIcon({
      html: `<div style="background:rgba(255,255,255,.92);border:1.5px solid ${m.color};border-radius:8px;padding:3px 10px;white-space:nowrap;pointer-events:none;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)">
        <div style="font-size:11px;font-weight:700;color:${m.color}">${TRANSPORT_ICON[m.transport]} ${m.name}</div>
        <div style="font-size:10px;color:#555;margin-top:1px">残り <b>${rem}</b> 件</div>
      </div>`,
      iconSize: [130, 40], iconAnchor: [65, 20], className: ''
    });
    zonePolys.push(poly, L.marker([clat, clng], { icon: lIcon, interactive: false }).addTo(map));
  });
}

// ============================================================
// MARKERS
// ============================================================
function makeIcon() {
  return L.divIcon({
    html: `<div style="width:26px;height:26px;border-radius:50%;background:#22c55e;border:3px solid #15803d;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.25)">✓</div>`,
    iconSize: [26, 26], iconAnchor: [13, 13], className: ''
  });
}

function addMarker(mi, latlng, savedId) {
  const id = savedId || (String(Date.now()) + String(Math.random()).slice(2, 7));
  const lm = L.marker(latlng, { icon: makeIcon(), riseOnHover: true }).addTo(map);
  const obj = { id, latlng, marker: lm };
  markers[mi].push(obj);
  bindMarkerPopup(obj, mi);
  if (!savedId) {
    history.push({ mi, id });
    sb('markers', {
      method: 'POST', prefer: 'return=minimal',
      body: JSON.stringify({ id, session: currentSession.id, member_id: currentSession.members[mi].id, lat: latlng.lat, lng: latlng.lng })
    }).catch(() => {});
  }
  updateAll();
}

function bindMarkerPopup(obj, mi) {
  obj.marker.bindPopup(`
    <div style="padding:12px 14px;min-width:140px">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text)">✅ 配布済み</div>
      <button style="width:100%;padding:9px;border-radius:9px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:#fff1f0;color:#dc2626"
        onclick="removeMarker('${obj.id}',${mi})">🗑 取り消し</button>
    </div>`, { maxWidth: 200 });
}

function removeMarker(id, mi) {
  const idx = markers[mi].findIndex(m => m.id === id);
  if (idx !== -1) { map.removeLayer(markers[mi][idx].marker); markers[mi].splice(idx, 1); }
  map.closePopup();
  sb(`markers?id=eq.${id}&session=eq.${currentSession.id}`, { method: 'DELETE' }).catch(() => {});
  updateAll();
}

function undoLast() {
  if (!history.length) { alert('元に戻せる操作がありません'); return; }
  const last = history.pop();
  removeMarker(last.id, last.mi);
}

function resetMyArea() {
  showConfirm('リセット確認', `自分のマーカーをすべて削除しますか？`, () => {
    [...markers[myMemberIdx]].forEach(mk => removeMarker(mk.id, myMemberIdx));
    history = history.filter(h => h.mi !== myMemberIdx);
  });
}

// ============================================================
// SYNC
// ============================================================
async function loadMarkers() {
  if (!currentSession) return;
  try {
    const data = await sb(`markers?session=eq.${currentSession.id}&select=*`, { method: 'GET', json: true, prefer: '' });
    if (!Array.isArray(data)) return;
    setSyncDot('green');

    const localIds = new Set();
    markers.forEach(arr => arr.forEach(m => localIds.add(m.id)));
    const remoteIds = new Set(data.map(d => d.id));

    // 追加
    data.forEach(d => {
      if (localIds.has(d.id)) return;
      const mi = currentSession.members.findIndex(m => m.id === d.member_id);
      if (mi < 0) return;
      const ll = L.latLng(d.lat, d.lng);
      const lm = L.marker(ll, { icon: makeIcon(), riseOnHover: true }).addTo(map);
      const obj = { id: d.id, latlng: ll, marker: lm };
      markers[mi].push(obj);
      bindMarkerPopup(obj, mi);
    });

    // 削除
    markers.forEach((arr, mi) => {
      const toRemove = arr.filter(m => !remoteIds.has(m.id));
      toRemove.forEach(m => { try { map.removeLayer(m.marker); } catch(e) {} });
      markers[mi] = arr.filter(m => remoteIds.has(m.id));
    });

    // GPS
    const gps = await sb(`gps_positions?session=eq.${currentSession.id}&select=*`, { method: 'GET', json: true, prefer: '' });
    if (Array.isArray(gps)) {
      gps.forEach(d => {
        const mi = currentSession.members.findIndex(m => m.id === d.member_id);
        if (mi < 0 || mi === myMemberIdx) return;
        updateOtherGPS(d.member_id, d.lat, d.lng, currentSession.members[mi]);
      });
    }

    updateAll();
  } catch(e) { setSyncDot('red'); }
}

function setSyncDot(s) { document.getElementById('sync-dot').className = s; }

function updateOtherGPS(memberId, lat, lng, m) {
  const ll = L.latLng(lat, lng);
  if (otherGpsMarkers[memberId]) {
    otherGpsMarkers[memberId].setLatLng(ll);
  } else {
    const icon = L.divIcon({
      html: `<div style="display:flex;flex-direction:column;align-items:center">
        <div style="background:${m.color};color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)">${TRANSPORT_ICON[m.transport]}</div>
        <div style="background:${m.color};color:#fff;border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700;margin-top:2px">${m.name}</div>
      </div>`,
      iconSize: [50, 46], iconAnchor: [25, 15], className: ''
    });
    otherGpsMarkers[memberId] = L.marker(ll, { icon, zIndexOffset: 8000 }).addTo(map);
  }
}

// ============================================================
// UI UPDATE
// ============================================================
function updateAll() {
  renderRemainBar();
  renderTabs();
  drawZones();
  updateBadge();
}

function renderRemainBar() {
  if (!currentSession) return;
  document.getElementById('remain-bar').innerHTML = currentSession.members.map((m, i) => {
    const done = markers[i] ? markers[i].length : 0;
    const rem = m.target ? Math.max(0, m.target - done) : '?';
    const active = i === myMemberIdx;
    return `<div class="rb ${active ? 'active' : ''}" style="border-top:3px solid ${m.color}" onclick="focusMember(${i})">
      <span class="rn" style="color:${m.color}">${rem}</span>
      <span class="rl">${TRANSPORT_ICON[m.transport]}${m.name}</span>
    </div>`;
  }).join('');
}

function renderTabs() {} // タブなし（残件バーに統合）

function updateBadge() {
  if (!currentSession) return;
  const td = markers.reduce((s, a) => s + a.length, 0);
  const tt = currentSession.total || currentSession.members.reduce((s, m) => s + (m.target || 0), 0);
  document.getElementById('staff-badge').textContent = `${td}/${tt}`;
}

function focusMember(idx) {
  const m = currentSession.members[idx];
  if (m.area && map) {
    const bounds = L.latLngBounds(m.area.map(c => L.latLng(c[0], c[1])));
    map.fitBounds(bounds, { padding: [40, 40] });
  }
}

// ============================================================
// BIZ MARKERS (zoom 17+)
// ============================================================
const BIZ_ZOOM = 17;
function updateBizVisibility() {
  const zoom = map.getZoom();
  bizLayers.forEach(b => {
    if (zoom >= BIZ_ZOOM) { if (!map.hasLayer(b)) b.addTo(map); }
    else { if (map.hasLayer(b)) map.removeLayer(b); }
  });
  if (zoom >= BIZ_ZOOM) fetchBizVisible();
}
function fetchBizVisible() {
  if (!currentSession) return;
  currentSession.members.forEach((m, i) => {
    if (!m.area || bizFetched[m.id]) return;
    const lats = m.area.map(c=>c[0]), lngs = m.area.map(c=>c[1]);
    const s=Math.min(...lats),n=Math.max(...lats),w=Math.min(...lngs),e=Math.max(...lngs);
    bizFetched[m.id] = true;
    const q = `[out:json][timeout:20];(node["amenity"](${s},${w},${n},${e});node["shop"](${s},${w},${n},${e});node["office"](${s},${w},${n},${e}););out center;`;
    fetch('https://overpass-api.de/api/interpreter', { method:'POST', body:'data='+encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal:AbortSignal.timeout(15000) })
    .then(r=>r.json()).then(data=>{
      (data.elements||[]).forEach(el=>{
        const tags=el.tags||{};
        const lat=el.lat||(el.center&&el.center.lat), lng=el.lon||(el.center&&el.center.lon);
        if(!lat||!lng) return;
        const name=tags.name||tags.amenity||tags.shop||'施設';
        const icon=L.divIcon({html:`<div style="font-size:17px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))">🏭</div>`,iconSize:[20,20],iconAnchor:[10,16],className:''});
        const lm=L.marker([lat,lng],{icon,zIndexOffset:400}).bindPopup(`<div style="padding:10px 12px"><div style="font-size:13px;font-weight:700;margin-bottom:4px">🏭 ${name}</div><div style="display:inline-block;background:#fee2e2;color:#dc2626;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:600">⛔ ポスティング除外</div></div>`,{maxWidth:200});
        bizLayers.push(lm);
        if(map.getZoom()>=BIZ_ZOOM) lm.addTo(map);
      });
    }).catch(()=>{ bizFetched[m.id]=false; });
  });
}

// ============================================================
// GPS
// ============================================================
function startGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(pos => {
    const { latitude:lat, longitude:lng, accuracy } = pos.coords;
    const ll = L.latLng(lat, lng);
    if (!gpsMarker) {
      gpsCircle = L.circle(ll,{radius:accuracy,color:'#0071e3',fillColor:'#0071e3',fillOpacity:0.08,weight:1}).addTo(map);
      gpsMarker = L.marker(ll,{icon:arrowIcon(gpsHeading),zIndexOffset:9000}).addTo(map);
    } else { gpsMarker.setLatLng(ll); gpsCircle.setLatLng(ll).setRadius(accuracy); }
    updateArrow();
    if (currentSession) {
      const mid = currentSession.members[myMemberIdx]?.id;
      if (mid) sb('gps_positions',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({session:currentSession.id,member_id:mid,lat,lng})}).catch(()=>{});
    }
  }, ()=>{}, {enableHighAccuracy:true,maximumAge:3000,timeout:15000});
  const h=e=>{gpsHeading=e.webkitCompassHeading??(e.alpha!=null?(360-e.alpha):null);updateArrow();};
  if(typeof DeviceOrientationEvent!=='undefined'){
    typeof DeviceOrientationEvent.requestPermission==='function'
      ?document.getElementById('gps-btn').addEventListener('click',()=>{DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')window.addEventListener('deviceorientation',h);});},{once:true})
      :window.addEventListener('deviceorientation',h);
  }
}
function arrowIcon(h){
  const has=h!=null;
  return L.divIcon({
    html:has
      ?`<div style="width:38px;height:38px;position:relative;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;inset:0;border-radius:50%;background:rgba(0,113,227,.12);animation:gp 2s infinite"></div>
          <svg viewBox="0 0 38 38" style="width:38px;height:38px;transform:rotate(${h}deg)">
            <circle cx="19" cy="19" r="11" fill="#0071e3" stroke="#fff" stroke-width="2.5"/>
            <polygon points="19,3 26,15 19,11 12,15" fill="#003d82" stroke="#fff" stroke-width="1"/>
          </svg></div><style>@keyframes gp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.6);opacity:.2}}</style>`
      :`<div style="width:34px;height:34px;position:relative;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;inset:0;border-radius:50%;background:rgba(0,113,227,.12);animation:gp 2s infinite"></div>
          <div style="width:18px;height:18px;border-radius:50%;background:#0071e3;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,113,227,.4)"></div></div>
        <style>@keyframes gp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.6);opacity:.2}}</style>`,
    iconSize:[38,38],iconAnchor:[19,19],className:''
  });
}
function updateArrow(){if(gpsMarker)gpsMarker.setIcon(arrowIcon(gpsHeading));}
function centerGPS(){if(gpsMarker)map.setView(gpsMarker.getLatLng(),17);}

// ============================================================
// STATS
// ============================================================
function showStatModal() {
  if (!currentSession) return;
  let td = 0;
  const rows = currentSession.members.map((m, i) => {
    const done = markers[i] ? markers[i].length : 0;
    const rem = m.target ? Math.max(0, m.target - done) : '?';
    const pct = m.target ? Math.round(done/m.target*100) : 0;
    td += done;
    return `<div class="stat-row">
      <span class="stat-name"><span class="stat-dot" style="background:${m.color}"></span>${TRANSPORT_ICON[m.transport]} ${m.name}</span>
      <span><span class="stat-val">残${rem}件</span><br><span class="stat-rem">${done}/${m.target||'?'}件(${pct}%)</span></span>
    </div>`;
  }).join('');
  const tt = currentSession.total || currentSession.members.reduce((s,m)=>s+(m.target||0),0);
  const pct = tt ? Math.round(td/tt*100) : 0;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('stat-sub').textContent = `配布済み ${td} / 目標 ${tt} 件`;
  document.getElementById('stat-rows').innerHTML = rows;
  document.getElementById('stat-modal').classList.add('show');
}
function hideStatModal() { document.getElementById('stat-modal').classList.remove('show'); }

// ============================================================
// CONFIRM
// ============================================================
let confirmCb = null;
function showConfirm(title, msg, cb) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  confirmCb = cb;
  document.getElementById('confirm-modal').classList.add('show');
}
function hideConfirm() { document.getElementById('confirm-modal').classList.remove('show'); confirmCb = null; }
document.getElementById('confirm-ok').onclick = () => { hideConfirm(); if(confirmCb) confirmCb(); };

// ============================================================
// CSV
// ============================================================
function exportCSV() {
  if (!currentSession) return;
  let csv = '\uFEFF担当者,緯度,経度\n';
  currentSession.members.forEach((m,i) => {
    (markers[i]||[]).forEach(mk => { csv += `${m.name},${mk.latlng.lat.toFixed(6)},${mk.latlng.lng.toFixed(6)}\n`; });
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download = `${currentSession.title||'posting'}_result.csv`;
  a.click();
}
</script>
