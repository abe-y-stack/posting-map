<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ポスティングマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,sans-serif;touch-action:pan-x pan-y}

/* 担当選択 */
#conn-panel{position:absolute;inset:0;z-index:3000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
#conn-box{background:#fff;border-radius:18px;padding:24px 22px;width:88%;max-width:340px}
#conn-box h2{font-size:17px;font-weight:700;margin-bottom:5px}
#conn-box p{font-size:12px;color:#777;margin-bottom:16px;line-height:1.6}
.conn-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 15px;border-radius:12px;border:1.5px solid #ddd;background:#fff;cursor:pointer;margin-bottom:9px;text-align:left}
.conn-btn:active{background:#f5f5f5}
.conn-icon{font-size:24px;flex-shrink:0}
.conn-label{font-size:13px;font-weight:700;color:#111}
.conn-sub{font-size:11px;color:#888;margin-top:1px}

/* ヘッダー */
#hdr{position:absolute;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,.97);border-bottom:1px solid #ddd;padding:8px 12px 0}
.hdr-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.hdr-top h1{font-size:14px;font-weight:700;color:#111;flex:1}
#badge{background:#111;color:#fff;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap}
#sync-st{font-size:10px;color:#888;margin-left:4px}
#tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:7px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:4px 9px;border-radius:99px;border:1.5px solid #ccc;background:#fff;font-size:11px;font-weight:600;color:#555;cursor:pointer;white-space:nowrap;text-align:center;line-height:1.4}

/* 残件バー */
#rbar{position:absolute;left:0;right:0;z-index:900;display:flex;border-bottom:1px solid #ddd;background:#fff}
.rb{flex:1;padding:4px 2px;text-align:center;font-size:9.5px;font-weight:600;border-right:1px solid #eee;cursor:pointer;line-height:1.4}
.rb:last-child{border-right:none}
.rb .rn{font-size:14px;font-weight:700;display:block}

#map{position:absolute;left:0;right:0}

/* ボトム */
#bot{position:absolute;bottom:0;left:0;right:0;z-index:1000;background:#fff;border-top:1px solid #ddd;height:56px;display:flex;align-items:center}
.bb{flex:1;height:100%;border:none;background:none;font-size:10px;color:#444;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bb .ic{font-size:16px;line-height:1}
.bb:active{background:#f0f0f0}
.bs{width:1px;height:26px;background:#e0e0e0}

#gps-st{position:absolute;right:8px;z-index:999;background:rgba(255,255,255,.93);border-radius:99px;padding:3px 9px;font-size:10px;border:1px solid #ddd;color:#555;cursor:pointer}
#hint{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:998;background:rgba(0,0,0,.68);color:#fff;padding:5px 13px;border-radius:99px;font-size:11px;white-space:nowrap;pointer-events:none;opacity:1;transition:opacity .5s}

/* モーダル */
#mbg{display:none;position:absolute;inset:0;z-index:2000;background:rgba(0,0,0,.45);align-items:center;justify-content:center}
#mbg.show{display:flex}
#modal{background:#fff;border-radius:18px;padding:20px 22px;width:88%;max-width:340px;max-height:88vh;overflow-y:auto}
#modal h2{font-size:16px;font-weight:700;margin-bottom:12px}
.mr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:12px;align-items:center}
.mr:last-child{border:none}
.mv{font-weight:700;text-align:right;font-size:11px;line-height:1.6}
.mname{display:flex;align-items:center}
.mdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-right:5px}
.bigpct{font-size:36px;font-weight:700;text-align:center;margin-bottom:3px}
.bigsub{font-size:12px;color:#888;text-align:center;margin-bottom:12px}
#mclose{width:100%;padding:11px;border-radius:10px;border:none;background:#111;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}

/* 凡例 */
#leg{position:absolute;left:8px;z-index:999;background:rgba(255,255,255,.95);border-radius:10px;padding:7px 10px;font-size:10px;border:1px solid #ddd;line-height:1.9}
.li{display:flex;align-items:center;gap:5px}
.lz{width:20px;height:3px;border-radius:2px;flex-shrink:0}

.apt-popup{padding:11px 13px;min-width:155px}
.apt-title{font-size:13px;font-weight:700;margin-bottom:4px}
.apt-sub{font-size:11px;color:#666;margin-bottom:7px;line-height:1.5}
.apt-badge{display:inline-block;background:#fef3c7;color:#92400e;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:600}
.biz-popup{padding:11px 13px;min-width:140px}
.biz-title{font-size:13px;font-weight:700;margin-bottom:4px}
.biz-badge{display:inline-block;background:#fee2e2;color:#991b1b;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:600}
</style>
</head>
<body>

<div id="conn-panel">
  <div id="conn-box">
    <h2>📮 ポスティングマップ</h2>
    <p>担当者を選んでください。<br>全員の位置と進捗がリアルタイム共有されます。</p>
    <button class="conn-btn" onclick="joinAs(0)">
      <span class="conn-icon">🚗</span>
      <div><div class="conn-label">中野主任</div><div class="conn-sub">久下戸・並木（東）250枚</div></div>

    <button class="conn-btn" onclick="joinAs(1)">
      <span class="conn-icon">🚗</span>

    </button>
    <button class="conn-btn" onclick="joinAs(2)">
      <span class="conn-icon">🚲</span>
      <div><div class="conn-label">安部</div><div class="conn-sub">的場（南） 250枚</div></div>
    </button>
    <button class="conn-btn" onclick="joinAs(3)">
      <span class="conn-icon">🚲</span>
      <div><div class="conn-label">嵐山</div><div class="conn-sub">的場（北）〜霞ヶ関南 250枚</div></div>
    </button>
  </div>
</div>

<div id="hdr">
  <div class="hdr-top">
    <h1>📮 ポスティングマップ</h1>
    <span id="sync-st">🔄</span>
    <div id="badge">0/1000件</div>
  </div>
  <div id="tabs"></div>
</div>
<div id="rbar"></div>
<div id="map"></div>
<div id="gps-st">📍 GPS取得中...</div>
<div id="hint">タップ → 配布済みマーク</div>

<div id="leg">
  <div class="li"><div class="lz" style="background:#c53030"></div>🚗 中野主任</div>
  <div class="li"><div class="lz" style="background:#c05621"></div>🚗 河野</div>
  <div class="li"><div class="lz" style="background:#2b6cb0"></div>🚲 安部</div>
  <div class="li"><div class="lz" style="background:#276749"></div>🚲 嵐山</div>
  <div class="li"><span style="font-size:12px">🏢</span> 集合住宅</div>
  <div class="li"><span style="font-size:12px">🏭</span> 会社(ズーム時)</div>
  <div class="li"><div style="width:14px;height:14px;border-radius:50%;background:#22c55e;border:2px solid #15803d;display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:700">✓</div>配布済み</div>
</div>

<div id="bot">
  <button class="bb" onclick="showStats()"><span class="ic">📊</span>進捗</button>
  <div class="bs"></div>
  <button class="bb" onclick="undoLast()"><span class="ic">↩️</span>戻す</button>
  <div class="bs"></div>
  <button class="bb" onclick="resetArea()"><span class="ic">🗑️</span>リセット</button>
  <div class="bs"></div>
  <button class="bb" onclick="centerGPS()"><span class="ic">🎯</span>現在地</button>
  <div class="bs"></div>
  <button class="bb" onclick="exportCSV()"><span class="ic">💾</span>CSV</button>
</div>

<div id="mbg" onclick="hideModal()">
  <div id="modal" onclick="event.stopPropagation()">
    <h2>📊 進捗レポート</h2>
    <div class="bigpct" id="mpct">0%</div>
    <div class="bigsub" id="msub">全0件</div>
    <div id="mrows"></div>
    <button id="mclose" onclick="hideModal()">閉じる</button>
  </div>
</div>

<script>
// ============================================================
// Supabase 設定
// ============================================================
const SB_URL = 'https://efznjrngolysrdxnmurp.supabase.co';
const SB_KEY = 'sb_publishable_kVLg2QozDdBIcLGcpvZwcw_VXwGyFrD';
const SESSION = 'kawagoe_posting_01';

async function sbFetch(path, opts = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=minimal',
      ...opts.headers
    },
    ...opts
  });
  if (opts.returnJson && res.ok) return res.json();
  return res;
}

// テーブル作成（初回のみ・エラーは無視）
async function setupDB() {
  // markers テーブル
  await sbFetch('markers?limit=1', { method: 'GET', returnJson: false })
    .catch(() => {});
}

// ============================================================
// 担当者・エリア定義
// ============================================================
const MEMBERS = [
  {
    id:'nakano', name:'中野主任', icon:'🚗', color:'#c53030',
    center:[35.905,139.527], zoom:15,
    zone:[[35.913,139.521],[35.913,139.535],[35.898,139.535],[35.898,139.521]],
    label:'🚗 中野主任\n久下戸・並木(東)',
    bbox:[35.898,139.521,35.913,139.535], target:250
  },
  {
    id:'kono', name:'河野', icon:'🚗', color:'#c05621',
    center:[35.903,139.512], zoom:15,
    zone:[[35.911,139.503],[35.911,139.521],[35.896,139.521],[35.896,139.503]],
    label:'🚗 河野\n南古谷・並木新町',
    bbox:[35.896,139.503,35.911,139.521], target:250
  },
  {
    id:'abe', name:'安部', icon:'🚲', color:'#2b6cb0',
    center:[35.914,139.440], zoom:15,
    zone:[[35.920,139.430],[35.920,139.450],[35.908,139.450],[35.908,139.430]],
    label:'🚲 安部\n的場（南）',
    bbox:[35.908,139.430,35.920,139.450], target:250
  },
  {
    id:'arashiyama', name:'嵐山', icon:'🚲', color:'#276749',
    center:[35.926,139.440], zoom:15,
    zone:[[35.932,139.430],[35.932,139.450],[35.920,139.450],[35.920,139.430]],
    label:'🚲 嵐山\n的場（北）〜霞ヶ関南',
    bbox:[35.920,139.430,35.932,139.450], target:250
  }
];

const APARTMENTS = [
  {name:'県営川越久下戸住宅',addr:'久下戸1-1',detail:'4棟212戸',lat:35.904626,lng:139.526422,owner:'🚗 中野主任'},
  {name:'並木7-22住宅',addr:'並木7-22',detail:'集合住宅',lat:35.904987,lng:139.517090,owner:'🚗 中野主任'},
  {name:'並木88-4住宅',addr:'並木88-4',detail:'集合住宅',lat:35.903728,lng:139.517126,owner:'🚗 中野主任'},
  {name:'南古谷39-2住宅',addr:'南古谷39-2',detail:'集合住宅',lat:35.904512,lng:139.520019,owner:'🚗 河野'},
  {name:'並木新町18-8住宅',addr:'並木新町18-8',detail:'集合住宅',lat:35.900929,lng:139.516758,owner:'🚗 河野'},
];

// ============================================================
// 状態
// ============================================================
let map, myIdx = -1;
let markers = MEMBERS.map(() => []); // [{id, latlng, marker}]
let zonePolys = [];
let bizLayers = []; // {marker, lat, lng} 会社マーカー
let bizFetched = {};
let gpsMarker = null, gpsCircle = null, gpsHeading = null;
let otherGpsMarkers = {}; // memberId -> marker
let markerId = String(Date.now());
let history = [];
let syncInterval = null;
let isTouching = false; // 二本指タッチ検出

// ============================================================
// レイアウト
// ============================================================
function initLayout() {
  const hH = document.getElementById('hdr').offsetHeight;
  const rH = 40, bH = 56;
  document.getElementById('rbar').style.top = hH + 'px';
  document.getElementById('map').style.top = (hH + rH) + 'px';
  document.getElementById('map').style.bottom = bH + 'px';
  document.getElementById('gps-st').style.top = (hH + rH + 8) + 'px';
  document.getElementById('leg').style.bottom = (bH + 8) + 'px';
}

// ============================================================
// 起動
// ============================================================
function joinAs(idx) {
  myIdx = idx;
  document.getElementById('conn-panel').style.display = 'none';
  initLayout();
  initMap();
  // ヒント3秒後に消す
  setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 3000);
  renderTabs();
  renderRemainBar();
  switchMember(idx);
  startGPS();
  setupDB().then(() => {
    loadAllMarkers();
    syncInterval = setInterval(loadAllMarkers, 5000); // 5秒ごと同期
  });
}

// ============================================================
// Supabase: マーカー読み込み（全員分）
// ============================================================
async function loadAllMarkers() {
  try {
    const data = await sbFetch(
      `markers?session=eq.${SESSION}&select=*`,
      { method: 'GET', returnJson: true, prefer: '' }
    );
    if (!Array.isArray(data)) return;
    setSyncStatus('🟢');

    // 既存のローカルIDセット
    const localIds = new Set();
    markers.forEach(arr => arr.forEach(m => localIds.add(m.id)));

    // 新規追加分だけ描画
    data.forEach(d => {
      if (!localIds.has(d.id)) {
        const mi = MEMBERS.findIndex(m => m.id === d.member_id);
        if (mi < 0) return;
        const ll = L.latLng(d.lat, d.lng);
        const lm = L.marker(ll, { icon: makeIcon(), riseOnHover: true }).addTo(map);
        const obj = { id: d.id, latlng: ll, marker: lm };
        markers[mi].push(obj);
        bindPopup(obj, mi);
      }
    });

    // 削除分を除去
    const remoteIds = new Set(data.map(d => d.id));
    markers.forEach((arr, mi) => {
      const toRemove = arr.filter(m => !remoteIds.has(m.id));
      toRemove.forEach(m => {
        map.removeLayer(m.marker);
      });
      markers[mi] = arr.filter(m => remoteIds.has(m.id));
    });

    // 他メンバーのGPS
    const gpsData = await sbFetch(
      `gps_positions?session=eq.${SESSION}&select=*`,
      { method: 'GET', returnJson: true, prefer: '' }
    );
    if (Array.isArray(gpsData)) {
      gpsData.forEach(d => {
        if (d.member_id !== MEMBERS[myIdx].id) {
          const mi = MEMBERS.findIndex(m => m.id === d.member_id);
          if (mi >= 0) updateOtherGPS(d.member_id, d.lat, d.lng, MEMBERS[mi]);
        }
      });
    }

    updateAll();
  } catch (e) {
    setSyncStatus('🔴');
  }
}

function setSyncStatus(s) {
  document.getElementById('sync-st').textContent = s;
}

// ============================================================
// Supabase: マーカー保存・削除
// ============================================================
async function saveMarker(mi, latlng, id) {
  try {
    await sbFetch('markers', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({
        id,
        session: SESSION,
        member_id: MEMBERS[mi].id,
        lat: latlng.lat,
        lng: latlng.lng
      })
    });
    setSyncStatus('🟢');
  } catch (e) { setSyncStatus('🔴'); }
}

async function deleteMarker(id) {
  try {
    await sbFetch(`markers?id=eq.${id}&session=eq.${SESSION}`, { method: 'DELETE' });
    setSyncStatus('🟢');
  } catch (e) { setSyncStatus('🔴'); }
}

async function saveGPS(lat, lng) {
  if (myIdx < 0) return;
  const mid = MEMBERS[myIdx].id;
  try {
    await sbFetch('gps_positions', {
      method: 'POST',
      prefer: 'resolution=merge-duplicates,return=minimal',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ session: SESSION, member_id: mid, lat, lng })
    });
  } catch (e) {}
}

// ============================================================
// 地図
// ============================================================
function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: false, tapTolerance: 15 });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, minZoom: 12 }).addTo(map);

  // ズームレベルに応じて会社マーカー表示切替
  map.on('zoomend', () => updateBizVisibility());

  // タップ → 配布済み（二本指操作は除外）
  map.on('click', e => {
    if (isTouching) return; // 二本指タッチ中は無視
    addMarker(myIdx, e.latlng);
  });

  // 二本指タッチ検出（ピンチズームとタップを分離）
  const md = document.getElementById('map');
  md.addEventListener('touchstart', e => {
    if (e.touches.length >= 2) {
      isTouching = true; // 二本指 → マーク禁止
    }
  }, { passive: true });
  md.addEventListener('touchend', e => {
    if (e.touches.length === 0) {
      // 全指離れたら少し待ってリセット（clickイベントより後）
      setTimeout(() => { isTouching = false; }, 300);
    }
  }, { passive: true });

  drawApartments();
}

// ============================================================
// 会社マーカー（ズームレベル17以上で表示）
// ============================================================
const BIZ_ZOOM = 17;

function updateBizVisibility() {
  const zoom = map.getZoom();
  bizLayers.forEach(b => {
    if (zoom >= BIZ_ZOOM) {
      if (!map.hasLayer(b.marker)) b.marker.addTo(map);
    } else {
      if (map.hasLayer(b.marker)) map.removeLayer(b.marker);
    }
  });
  // 未取得エリアを取得
  if (zoom >= BIZ_ZOOM) fetchBizVisible();
}

function fetchBizVisible() {
  const bounds = map.getBounds();
  MEMBERS.forEach((m, i) => {
    if (bizFetched[i]) return;
    const [s,w,n,e] = m.bbox;
    // 表示範囲と交差するエリアのみ取得
    if (bounds.getEast() < w || bounds.getWest() > e || bounds.getNorth() < s || bounds.getSouth() > n) return;
    bizFetched[i] = true;
    const q = `[out:json][timeout:20];(node["amenity"](${s},${w},${n},${e});node["shop"](${s},${w},${n},${e});node["office"](${s},${w},${n},${e}););out center;`;
    fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST', body: 'data=' + encodeURIComponent(q),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      signal: AbortSignal.timeout(18000)
    }).then(r => r.json()).then(data => {
      const zoom = map.getZoom();
      (data.elements || []).forEach(el => {
        const tags = el.tags || {};
        const lat = el.lat || (el.center && el.center.lat);
        const lng = el.lon || (el.center && el.center.lon);
        if (!lat || !lng) return;
        const name = tags.name || tags.amenity || tags.shop || tags.office || '施設';
        const icon = L.divIcon({
          html: `<div style="font-size:18px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))">🏭</div>`,
          iconSize: [22, 22], iconAnchor: [11, 18], className: ''
        });
        const lm = L.marker([lat, lng], { icon, zIndexOffset: 400 });
        lm.bindPopup(`<div class="biz-popup">
          <div class="biz-title">🏭 ${name}</div>
          <span class="biz-badge">⛔ ポスティング除外</span>
        </div>`, { maxWidth: 200 });
        bizLayers.push({ marker: lm, lat, lng });
        if (zoom >= BIZ_ZOOM) lm.addTo(map);
      });
    }).catch(() => { bizFetched[i] = false; });
  });
}

// ============================================================
// マーカー追加
// ============================================================
function addMarker(mi, latlng, savedId) {
  const id = savedId || (String(Date.now()) + String(Math.random()).slice(2, 7));
  const lm = L.marker(latlng, { icon: makeIcon(), riseOnHover: true }).addTo(map);
  const obj = { id, latlng, marker: lm };
  markers[mi].push(obj);
  bindPopup(obj, mi);
  if (!savedId) {
    history.push({ mi, id });
    saveMarker(mi, latlng, id);
  }
  updateAll();
  return obj;
}

function makeIcon() {
  return L.divIcon({
    html: `<div style="width:26px;height:26px;border-radius:50%;
      background:#22c55e;border:3px solid #15803d;
      display:flex;align-items:center;justify-content:center;
      font-size:14px;color:#fff;font-weight:900;
      box-shadow:0 2px 6px rgba(0,0,0,.35)">✓</div>`,
    iconSize: [26, 26], iconAnchor: [13, 13], className: ''
  });
}

function bindPopup(obj, mi) {
  obj.marker.bindPopup(`
    <div style="padding:12px 14px;min-width:150px">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">✅ 配布済み</div>
      <button style="width:100%;padding:9px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer;
        background:#fee2e2;color:#dc2626"
        onclick="removeMarkerAction('${obj.id}',${mi})">🗑 取り消し・削除</button>
    </div>`, { maxWidth: 210 });
}

function removeMarkerAction(id, mi) {
  const idx = markers[mi].findIndex(m => m.id === id);
  if (idx !== -1) {
    map.removeLayer(markers[mi][idx].marker);
    markers[mi].splice(idx, 1);
  }
  map.closePopup();
  deleteMarker(id);
  updateAll();
}

function undoLast() {
  if (!history.length) { alert('元に戻せる操作がありません'); return; }
  const last = history.pop();
  removeMarkerAction(last.id, last.mi);
}

function resetArea() {
  const m = MEMBERS[myIdx];
  if (!confirm(`${m.icon}${m.name} のマーカーをすべて削除しますか？`)) return;
  [...markers[myIdx]].forEach(mk => removeMarkerAction(mk.id, myIdx));
  history = history.filter(h => h.mi !== myIdx);
}

// ============================================================
// 他メンバーのGPSアイコン
// ============================================================
function updateOtherGPS(memberId, lat, lng, m) {
  const ll = L.latLng(lat, lng);
  if (otherGpsMarkers[memberId]) {
    otherGpsMarkers[memberId].setLatLng(ll);
  } else {
    const icon = L.divIcon({
      html: `<div style="display:flex;flex-direction:column;align-items:center">
        <div style="background:${m.color};color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">${m.icon}</div>
        <div style="background:${m.color};color:#fff;border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;margin-top:2px;white-space:nowrap">${m.name}</div>
      </div>`,
      iconSize: [50, 46], iconAnchor: [25, 15], className: ''
    });
    otherGpsMarkers[memberId] = L.marker(ll, { icon, zIndexOffset: 8000 }).addTo(map);
  }
}

// ============================================================
// 集合住宅ピン
// ============================================================
function drawApartments() {
  APARTMENTS.forEach(apt => {
    const icon = L.divIcon({
      html: `<div style="font-size:20px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))">🏢</div>`,
      iconSize: [26, 26], iconAnchor: [13, 22], className: ''
    });
    L.marker([apt.lat, apt.lng], { icon, zIndexOffset: 500 }).addTo(map)
      .bindPopup(`<div class="apt-popup">
        <div class="apt-title">🏢 ${apt.name}</div>
        <div class="apt-sub">${apt.addr} / ${apt.detail}</div>
        <span class="apt-badge">${apt.owner}担当</span>
      </div>`, { maxWidth: 230 });
  });
}

// ============================================================
// ゾーン描画
// ============================================================
function drawZones() {
  zonePolys.forEach(p => map.removeLayer(p));
  zonePolys = [];
  MEMBERS.forEach((m, i) => {
    const active = i === myIdx;
    const poly = L.polygon(m.zone, {
      color: m.color, fillColor: m.color,
      fillOpacity: active ? 0.12 : 0.04,
      weight: active ? 2.5 : 1.5,
      dashArray: '7 5', opacity: active ? 1 : 0.5
    }).addTo(map);
    const lats = m.zone.map(c => c[0]), lngs = m.zone.map(c => c[1]);
    const clat = (Math.min(...lats) + Math.max(...lats)) / 2;
    const clng = (Math.min(...lngs) + Math.max(...lngs)) / 2;
    const done = markers[i].length;
    const rem = Math.max(0, m.target - done);
    const lines = m.label.split('\n');
    const lIcon = L.divIcon({
      html: `<div style="background:rgba(255,255,255,.92);border:1.5px solid ${m.color};border-radius:7px;padding:3px 9px;white-space:nowrap;pointer-events:none;text-align:center">
        <div style="font-size:11px;font-weight:700;color:${m.color}">${lines[0]}</div>
        <div style="font-size:10px;color:#555">${lines[1] || ''}</div>
        <div style="font-size:10px;color:#222;margin-top:1px">残り <b>${rem}</b> 件</div>
      </div>`,
      iconSize: [148, 46], iconAnchor: [74, 23], className: ''
    });
    zonePolys.push(poly, L.marker([clat, clng], { icon: lIcon, interactive: false }).addTo(map));
  });
}

// ============================================================
// タブ・残件バー
// ============================================================
function renderTabs() {
  if (myIdx < 0) return;
  document.getElementById('tabs').innerHTML = MEMBERS.map((m, i) => {
    const done = markers[i].length;
    const pct = Math.round(done / m.target * 100);
    const on = i === myIdx;
    return `<button class="tab"
      style="${on ? `background:${m.color};color:#fff;border-color:${m.color}` : 'color:#555'}"
      onclick="switchMember(${i})">
      ${m.icon}${m.name}<br>
      <span style="font-size:9px;opacity:.85">${done}/${m.target}(${pct}%)</span>
    </button>`;
  }).join('');
}

function renderRemainBar() {
  if (myIdx < 0) return;
  document.getElementById('rbar').innerHTML = MEMBERS.map((m, i) => {
    const done = markers[i].length;
    const rem = Math.max(0, m.target - done);
    return `<div class="rb"
      style="background:${i === myIdx ? m.color + '18' : '#fff'};border-top:3px solid ${m.color}"
      onclick="switchMember(${i})">
      <span class="rn" style="color:${m.color}">${rem}</span>
      <span style="font-size:9px;opacity:.7">${m.icon}${m.name}/250</span>
    </div>`;
  }).join('');
}

function updateBadge() {
  const td = markers.reduce((s, a) => s + a.length, 0);
  document.getElementById('badge').textContent = `${td}/1000件`;
}

function switchMember(idx) {
  myIdx = idx;
  map.setView(MEMBERS[idx].center, MEMBERS[idx].zoom);
  updateAll();
}

function updateAll() {
  renderRemainBar();
  renderTabs();
  drawZones();
  updateBadge();
}

// ============================================================
// GPS + 方向矢印
// ============================================================
function startGPS() {
  if (!navigator.geolocation) {
    document.getElementById('gps-st').textContent = '📍GPS非対応';
    return;
  }
  navigator.geolocation.watchPosition(pos => {
    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
    const ll = L.latLng(lat, lng);
    if (!gpsMarker) {
      gpsCircle = L.circle(ll, { radius: accuracy, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.08, weight: 1 }).addTo(map);
      gpsMarker = L.marker(ll, { icon: buildArrowIcon(gpsHeading), zIndexOffset: 9000 }).addTo(map);
    } else {
      gpsMarker.setLatLng(ll);
      gpsCircle.setLatLng(ll).setRadius(accuracy);
    }
    updateArrow();
    const ac = accuracy < 20 ? '高精度' : accuracy < 60 ? '中精度' : '低精度';
    document.getElementById('gps-st').textContent = `📍${ac}±${Math.round(accuracy)}m`;
    saveGPS(lat, lng);
  }, e => {
    document.getElementById('gps-st').textContent = `📍${{ 1: '許可必要', 2: '失敗', 3: 'TOut' }[e.code] || 'エラー'}`;
  }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 });

  const handler = e => {
    gpsHeading = e.webkitCompassHeading ?? (e.alpha != null ? (360 - e.alpha) : null);
    updateArrow();
  };
  if (typeof DeviceOrientationEvent !== 'undefined') {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      document.getElementById('gps-st').addEventListener('click', () => {
        DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') window.addEventListener('deviceorientation', handler); });
      }, { once: true });
    } else {
      window.addEventListener('deviceorientation', handler);
    }
  }
}

function buildArrowIcon(h) {
  const has = h != null;
  return L.divIcon({
    html: has
      ? `<div style="width:40px;height:40px;position:relative;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;inset:0;border-radius:50%;background:rgba(59,130,246,.15);animation:gp 2s infinite"></div>
          <svg viewBox="0 0 40 40" style="width:40px;height:40px;transform:rotate(${h}deg)">
            <circle cx="20" cy="20" r="11" fill="#3b82f6" stroke="#fff" stroke-width="2.5"/>
            <polygon points="20,3 27,16 20,12 13,16" fill="#1d4ed8" stroke="#fff" stroke-width="1.2"/>
          </svg></div>
          <style>@keyframes gp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.7);opacity:.2}}</style>`
      : `<div style="width:36px;height:36px;position:relative;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;inset:0;border-radius:50%;background:rgba(59,130,246,.15);animation:gp 2s infinite"></div>
          <div style="width:20px;height:20px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 2px 8px rgba(59,130,246,.5)"></div>
        </div>
        <style>@keyframes gp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.7);opacity:.2}}</style>`,
    iconSize: [40, 40], iconAnchor: [20, 20], className: ''
  });
}
function updateArrow() { if (gpsMarker) gpsMarker.setIcon(buildArrowIcon(gpsHeading)); }
function centerGPS() {
  if (gpsMarker) map.setView(gpsMarker.getLatLng(), 17);
  else alert('GPS取得中です。');
}

// ============================================================
// 統計モーダル
// ============================================================
function showStats() {
  let td = 0;
  const rows = MEMBERS.map((m, i) => {
    const done = markers[i].length;
    const rem = Math.max(0, m.target - done);
    const pct = Math.round(done / m.target * 100);
    td += done;
    return `<div class="mr">
      <span class="mname"><span class="mdot" style="background:${m.color}"></span>${m.icon}${m.name}</span>
      <span class="mv">残<b>${rem}</b>件<br>
        <span style="color:#888;font-size:10px">${done}/250件(${pct}%)</span>
      </span>
    </div>`;
  }).join('');
  document.getElementById('mpct').textContent = Math.round(td / 1000 * 100) + '%';
  document.getElementById('msub').textContent = `配布済み ${td} / 目標 1000 件`;
  document.getElementById('mrows').innerHTML = rows;
  document.getElementById('mbg').classList.add('show');
}
function hideModal() { document.getElementById('mbg').classList.remove('show'); }

// ============================================================
// CSV
// ============================================================
function exportCSV() {
  let csv = '\uFEFF担当者,緯度,経度\n';
  MEMBERS.forEach((m, i) => {
    markers[i].forEach(mk => {
      csv += `${m.name},${mk.latlng.lat.toFixed(6)},${mk.latlng.lng.toFixed(6)}\n`;
    });
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = 'posting_result.csv';
  a.click();
}
</script>
